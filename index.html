<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>¡Que llegamos tarde!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--ink:#2b2340;--accent:#ff6b4a;--ok:#2bb673;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:960px;margin:0 auto}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:#fff;font-weight:800;border-radius:0 0 18px 18px}
#hud.hidden{visibility:hidden}
#clock{font-size:28px;font-variant-numeric:tabular-nums;background:#000;padding:0 12px;border-radius:10px;color:#7cff7c;min-width:92px;text-align:center}
#clock.late{color:#ff5a5a;animation:blink .5s infinite alternate}
#phaseName{flex:1;text-align:center;font-size:18px}
#mute{background:none;border:0;font-size:22px;cursor:pointer}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;transition:background .4s}
#stage.night{background:#1d1b4a}
#stage.shake{animation:shake .3s}
.card{background:var(--card);border-radius:26px;padding:22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.08);max-width:440px;width:100%}
.card h1{margin:6px 0;font-size:34px;line-height:1.1;color:var(--accent)}
.card h2{margin:6px 0;font-size:28px}
.card p{font-size:18px;margin:8px 0}
.big{font-size:64px;line-height:1.1}
.ctrl{background:#f1ecff;border-radius:12px;padding:6px;font-weight:800}
.btn{font:inherit;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:10px 30px;background:var(--accent);color:#fff;box-shadow:0 6px 0 #c94a30;cursor:pointer;margin:8px 4px 0}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a30}
.btn.alt{background:#7b6cf6;box-shadow:0 6px 0 #5446c4}
.names{display:flex;gap:10px;justify-content:center;margin:10px 0}
.names label{font-size:26px;display:flex;align-items:center;gap:4px}
.names input{font:inherit;font-size:18px;width:120px;padding:4px 10px;border-radius:12px;border:3px solid #e2dbff}
.best{color:#7b6cf6;font-weight:800}
canvas.game{border-radius:22px;touch-action:none;box-shadow:0 8px 0 rgba(0,0,0,.12)}
/* despertar */
.room{display:flex;gap:14px;width:100%;justify-content:center}
.bed{background:#3b357a;color:#fff;border-radius:24px;padding:14px 8px;flex:1;max-width:220px;text-align:center;position:relative;cursor:pointer;transition:background .3s}
.bed.awake{background:#2bb673}
.bed .kid{font-size:68px;transition:transform .1s;line-height:1}
.bed .bedimg{font-size:58px;margin-top:-18px}
.bed .name{font-weight:800;font-size:20px}
.zzz{position:absolute;right:12px;top:6px;font-size:28px;animation:bob 1.4s infinite}
.meter{height:16px;background:rgba(255,255,255,.25);border-radius:8px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#7cff7c)}
.float{position:absolute;left:50%;top:30%;pointer-events:none;font-weight:800;font-size:18px;animation:up 1s forwards;white-space:nowrap;transform:translateX(-50%);color:#fff;text-shadow:0 2px 0 #000;z-index:5}
/* vestir */
.dress{width:100%;max-width:460px;text-align:center}
.avatar{font-size:76px;line-height:1}
.who{font-size:20px}
.checklist{display:flex;justify-content:center;gap:6px;margin:10px 0}
.checklist span{font-size:30px;padding:4px 6px;border-radius:12px;background:#eee;opacity:.35}
.checklist span.done{opacity:1;background:#c6f6d5}
.checklist span.now{opacity:1;background:#ffe08a;outline:3px solid var(--accent);animation:bob .8s infinite}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{font-size:38px;padding:8px 0;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer}
.grid button:active{transform:translateY(3px)}
.grid button.wrong{background:#ffd6cc;animation:shake .3s}
/* cole */
.gate{width:100%;max-width:440px;text-align:center}
.school{font-size:90px;line-height:1}
.kids{display:flex;justify-content:center;gap:30px;margin:6px 0}
.gk{position:relative;font-weight:800;transition:transform .8s,opacity .8s}
.gk .e{font-size:54px}
.gk.cur{animation:bob .8s infinite}
.gk.gone,.gk.run{transform:translateY(-120px) scale(.4);opacity:0}
.bar{position:relative;height:44px;background:#ffd6cc;border-radius:22px;overflow:hidden;margin:14px 0}
.zone{position:absolute;top:0;bottom:0;background:var(--ok)}
.needle{position:absolute;top:0;bottom:0;width:8px;background:var(--ink);border-radius:4px}
/* varios */
#toast{position:fixed;top:64px;left:50%;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:14px;font-weight:800;opacity:0;transition:.2s;z-index:20;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#e0412a}#toast.good{background:var(--ok)}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall linear forwards;pointer-events:none;z-index:30}
.stars{font-size:48px;letter-spacing:4px}
.stats{display:flex;justify-content:center;gap:16px;font-weight:800}

/* pixel */
.card h1,.card h2,.btn,#clock,#phaseName{font-family:'Press Start 2P',monospace}
.card h1{font-size:26px;line-height:1.3;color:var(--accent);text-shadow:3px 3px 0 var(--ink);margin:8px 0}
.card h2{font-size:16px;line-height:1.4}
.btn{font-size:14px;padding:14px 24px}
#clock{font-size:16px;padding:6px 10px}
#phaseName{font-size:11px}
.sub{font-weight:800;color:#7b6cf6;margin-top:0}
.lbl{font-weight:800;margin-bottom:0}
canvas.pix{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none;background:#000}
.plat{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;height:100%;justify-content:center}
.pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;padding:0 8px}
.pad div{display:flex;gap:14px}
.pad button{width:70px;height:70px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:28px;touch-action:none;box-shadow:0 5px 0 #000;-webkit-user-select:none;user-select:none}
.pad button:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.pad button.jb{width:84px;height:84px;background:var(--accent);box-shadow:0 5px 0 #a8341c}
.keys{font-size:14px;opacity:.7;margin:0}
.rot{display:none;margin:0;font-weight:800;color:#7b6cf6}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}}
.heroes{display:flex;gap:14px;justify-content:center;margin:8px 0}
.hero{border:4px solid #e2dbff;background:#fff;border-radius:16px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.hero canvas{width:64px;height:80px;image-rendering:pixelated}
.hero.sel{border-color:var(--accent);background:#fff1ec}
@keyframes blink{to{opacity:.4}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="hidden">
    <div id="clock">7:45</div>
    <div id="phaseName"></div>
    <div>🔔 9:00 <button id="mute" aria-label="Sonido">🔊</button></div>
  </header>
  <main id="stage"></main>
</div>
<div id="toast"></div>

<script>
// ===== utilidades =====
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>{m=Math.floor(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');};

const W=400,H=600;
const START=7*60+45, BELL=9*60;   // empieza 7:45, campana 9:00
const REAL_SEC_PER_MIN=1.2;        // 1 minuto de juego = 1,2 s reales
const KID_EMO=['👧','🧒'];
const stage=$('#stage');

const G={clock:START,running:false,names:['Sofía','Leo'],penalty:0,bonus:0,tick:null,onKey:null,resize:null,muted:false,keys:{}};
G.hero='mama';
try{const n=JSON.parse(localStorage.getItem('cole-names'));if(Array.isArray(n)&&n.length===2)G.names=n;const h=localStorage.getItem('cole-hero');if(h==='mama'||h==='papa')G.hero=h;}catch(e){}

// ===== sonido (sin archivos, con WebAudio) =====
let AC;
function sfx(type){
  if(G.muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const map={good:[660,990,.1],bad:[220,90,.25],win:[523,1046,.45],tap:[420,560,.05],jump:[300,700,.12],bell:[880,880,.6]};
    const [f1,f2,d]=map[type];const t=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type==='bad'?'sawtooth':type==='jump'?'square':'triangle';
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
$('#mute').onclick=()=>{G.muted=!G.muted;$('#mute').textContent=G.muted?'🔇':'🔊';};

// ===== feedback =====
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1500);}
function floatAt(el,txt,color){const f=document.createElement('div');f.className='float';f.textContent=txt;if(color)f.style.color=color;el.appendChild(f);setTimeout(()=>f.remove(),1000);}
function shake(){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');}
function confetti(){for(let i=0;i<26;i++){const d=document.createElement('div');d.className='conf';d.textContent=pick(['🎉','⭐','✨','🎈','🌟']);d.style.left=rnd(2,96)+'vw';d.style.animationDuration=rnd(.9,1.7)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}}
function addMin(n,msg){G.clock+=n;G.penalty+=n;toast('⏱️ +'+n+' min · '+msg,'bad');sfx('bad');shake();updClock();}
function bonusMin(n,msg){G.clock-=n;G.bonus+=n;toast('⏱️ −'+n+' min · '+msg,'good');sfx('good');updClock();}
function updClock(){const c=$('#clock');c.textContent=fmt(G.clock);c.classList.toggle('late',G.clock>=BELL-10);}

// ===== bucle principal =====
let last=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(G.running){G.clock+=dt/REAL_SEC_PER_MIN;updClock();}
  if(G.tick)G.tick(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(!G.keys[e.key]&&G.onKey)G.onKey(e.key);
  G.keys[e.key]=true;
});
addEventListener('keyup',e=>{G.keys[e.key]=false;});
addEventListener('resize',()=>G.resize&&G.resize());

// ===== lienzo para los minijuegos de acción =====
function makeCanvas(){
  stage.innerHTML='';
  const c=document.createElement('canvas');c.width=W;c.height=H;c.className='game';stage.appendChild(c);
  const fit=()=>{const s=Math.min((stage.clientWidth-24)/W,(stage.clientHeight-24)/H);c.style.width=W*s+'px';c.style.height=H*s+'px';};
  fit();G.resize=fit;
  return {c,ctx:c.getContext('2d'),toLocal(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}};
}
function emo(ctx,e,x,y,size,rot){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,0);ctx.restore();
}
function label(ctx,txt,x,y,size,color){ctx.font='800 '+size+'px "Baloo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(txt,x,y);ctx.fillStyle=color||'#2b2340';ctx.fillText(txt,x,y);}

// =====================================================================
// ===== PLATAFORMAS EN PIXEL ART ======================================
// =====================================================================
const VW=320,VH=176,TS=16,ROWS=11,GROUND=(ROWS-1)*TS;
const SK='#f5c39b',INK='#1b1424';
const HEROES={
  mama:{name:'Mamá',hair:'#7a3b1d',top:'#ff5d8f',bottom:'#ff5d8f',shoe:'#e0244a',mom:true,lines:['¡VAMOS, CARIÑO!','¡QUE LLEGAMOS TARDE!','¡LOS ZAPATOS!','¡CORRE, CORRE!','¡LA MOCHILA!','¡AY, MIS LLAVES!']},
  papa:{name:'Papá',hair:'#2d2016',top:'#3d7be0',bottom:'#2b3355',shoe:'#3a2a1a',beard:true,lines:['¡VAMOS, CAMPEONES!','¡QUE LLEGAMOS TARDE!','¡CORRE, CORRE!','¡LA MOCHILA!']}
};
const KIDPAL=[{hair:'#c4552b',top:'#ffd23f',bottom:'#7b6cf6',pig:true},{hair:'#4a2a14',top:'#2bb673',bottom:'#2b3355'}];
const OTHER={hair:'#555',top:'#8a8a99',bottom:'#444',shoe:'#222'};
const SOLID=new Set(['#','x','q','u','c']);
const FOODS=['toast','milk','banana','apple'];

function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}
function painter(c,x,y,f,W){return (lx,ly,w,h,col)=>rect(c,f>0?x+lx:x+W-lx-w,y+ly,w,h,col);}
function ptext(c,txt,x,y,col,align){
  c.font='8px "Press Start 2P",monospace';c.textAlign=align||'left';c.textBaseline='top';
  c.fillStyle=INK;c.fillText(txt,x+1,y+1);c.fillStyle=col||'#fff';c.fillText(txt,x,y);
}

// ---- sprites ----
function drawHero(c,x,y,f,run,air,P){
  const R=painter(c,x,y,f,12);
  const s=air?0:Math.round(Math.sin(run)*2);
  if(P.mom){
    const wave=air?2:Math.round(Math.sin(run*.5));
    R(1,1,3,10+wave,P.hair);R(0,4,2,6+wave,P.hair);                        // melena larga al viento
    R(1,7,2,5,'#e0412a');                                                  // mochila del cole
    if(air){R(3,13,2,3,SK);R(7,12,2,4,SK);R(2,16,3,1,P.shoe);R(7,16,3,1,P.shoe);R(2,17,1,1,P.shoe);}
    else{R(4+s,13,2,4,SK);R(6-s,13,2,4,SK);R(4+s,17,3,1,P.shoe);R(6-s,17,3,1,P.shoe);R(4+s,16,1,1,P.shoe);}
    R(4,7,6,3,P.top);R(5,7,4,1,'#ffb3c8');                                 // cuerpo del vestido
    R(4,10,6,1,'#7a3b8f');                                                 // cinturón
    R(3,11,8,1,P.top);R(2,12,10,2,P.top);R(4,12,1,1,'#fff');R(8,13,1,1,'#fff'); // falda con lunares
    if(air){R(9,3,2,5,P.top);R(9,2,2,1,SK);}
    else{R(6-s,8,2,3,P.top);R(6-s,11,2,1,SK);R(5-s,12,4,3,'#7a3b8f');R(6-s,11,1,1,'#7a3b8f');} // brazo con bolso
    R(4,0,6,7,SK);R(3,0,7,2,P.hair);R(4,2,1,3,P.hair);R(9,1,1,1,P.hair);    // cara y flequillo
    R(4,0,5,1,'#e0244a');                                                   // diadema
    R(8,3,1,1,INK);R(9,2,1,1,INK);                                          // ojo con pestaña
    R(8,5,2,1,'#e0244a');                                                   // labios
    R(5,5,1,1,'#ffd23f');                                                   // pendiente
    return;
  }
  R(0,7,3,6,'#e0412a');R(0,7,3,1,'#a52a1a');
  const lc=P.dress?SK:P.bottom;
  if(air){R(3,13,2,3,lc);R(7,12,2,4,lc);R(2,16,3,1,P.shoe);R(7,16,3,1,P.shoe);}
  else{R(4+s,13,2,4,lc);R(6-s,13,2,4,lc);R(3+s,17,3,1,P.shoe);R(6-s,17,3,1,P.shoe);}
  if(P.dress){R(3,7,7,4,P.top);R(2,11,9,2,P.top);}
  else{R(3,7,7,5,P.top);R(3,12,7,1,P.bottom);}
  if(air){R(9,3,2,5,P.top);R(9,2,2,1,SK);}else{R(6-s,8,2,3,P.top);R(6-s,11,2,1,SK);}
  R(3,0,7,7,SK);R(3,0,7,2,P.hair);R(3,2,2,3,P.hair);
  R(8,3,1,1,INK);
  if(P.beard){R(6,5,4,2,P.hair);}else R(8,5,2,1,'#b4434b');
}
function drawKid(c,x,y,f,run,air,P){
  const R=painter(c,x,y,f,8);const s=air?0:Math.round(Math.sin(run));
  R(2+s,9,2,2,P.bottom);R(4-s,9,2,2,P.bottom);R(2+s,11,2,1,INK);R(4-s,11,2,1,INK);
  R(1,5,6,4,P.top);R(0,5,2,4,'#e0412a');
  R(1,0,6,5,SK);R(1,0,6,2,P.hair);R(1,2,1,2,P.hair);
  if(P.pig){R(0,1,1,3,P.hair);R(7,1,1,3,P.hair);}
  R(5,2,1,1,INK);
}
function drawCat(c,x,y,f,t){
  const R=painter(c,x,y,f,12),col='#8a8a99',s=Math.round(Math.sin(t*14));
  R(1,3,8,3,col);R(8,0,4,4,col);R(8,-1,1,1,col);R(11,-1,1,1,col);R(10,1,1,1,'#ffd23f');
  R(0,1+s,1,3,col);R(2,6,1,1,col);R(7,6,1,1,col);R(3+(s>0?1:0),6,1,1,col);
}
function drawDog(c,x,y,f,t,happy){
  const R=painter(c,x,y,f,14),col='#b07a45',s=Math.round(Math.sin(t*(happy?20:14)));
  R(1,3,9,4,col);R(9,0,5,5,col);R(9,0,2,3,'#7a4f28');R(12,1,1,1,INK);R(13,3,1,1,INK);
  R(0,1+(happy?s:0),1,3,col);
  if(happy){R(2,7,8,2,col);R(12,5,1,2,'#ff7b9c');}else{R(2+(s>0?1:0),7,1,2,col);R(8-(s>0?1:0),7,1,2,col);}
}
function drawStroller(c,x,y,f,t){
  const run=t*8;
  drawHero(c,f>0?x:x+12,y,f,run,false,OTHER);
  const R=painter(c,x,y,f,24);
  R(12,9,3,1,INK);R(14,8,9,6,'#5b4bd6');R(14,5,6,4,'#5b4bd6');R(15,14,2,2,INK);R(21,14,2,2,INK);R(16,9,5,2,'#8b7cf6');
}
function drawHaz(c,h,x,y){
  switch(h.type){
    case 'lego':rect(c,x,y+1,8,3,'#e0412a');rect(c,x+1,y,2,1,'#e0412a');rect(c,x+5,y,2,1,'#e0412a');rect(c,x,y+3,8,1,'#a52a1a');break;
    case 'milk':rect(c,x+1,y,14,2,'#f4f4ff');rect(c,x,y+1,16,2,'#f4f4ff');rect(c,x+3,y,3,1,'#fff');break;
    case 'water':case 'puddle':rect(c,x+1,y,14,2,'#6fc3ff');rect(c,x,y+1,16,2,'#4aa8e8');rect(c,x+3,y,3,1,'#bfe9ff');break;

function buildLevel(def){
  const w=def.w,rows=[];for(let y=0;y<ROWS;y++)rows.push(Array(w).fill('.'));
  const L={w,rows,theme:def.theme,start:def.start,need:def.need||0,food:0,ents:[],items:[],haz:[],beds:[],deco:[],boxes:{},exit:null,trail:[],followers:[],parts:[],texts:[]};
  const set=(x,y,ch)=>{if(x>=0&&x<w&&y>=0&&y<ROWS)rows[y][x]=ch;};
  let fi=0;
  const DIMS={cat:[12,7,30,'¡Te ha arañado el gato! 🐱'],dog:[14,9,45,'¡El perro quiere jugar! 🐶'],stroller:[24,18,26,'¡Choque con un carrito! 👶']};
  const HZ={lego:[8,4,'¡AY! ¡Un Lego! 🦶'],milk:[16,3,'¡Plaf! Leche derramada 🥛'],water:[16,3,'¡Plaf! Un charco 💦'],puddle:[16,3,'¡Plaf! ¡Charco! 💦'],poop:[7,5,'¡Puaj! ¡Caca de perro! 💩']};
  const A={
    fill(x1,x2,y,ch){for(let x=x1;x<=x2;x++)set(x,y,ch);},
    block(x1,x2,y1,y2,ch){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)set(x,y,ch);},
    pit(x1,x2){for(let x=x1;x<=x2;x++)set(x,ROWS-1,'.');},
    deco(type,x,y,extra){L.deco.push(Object.assign({type,x,y},extra||{}));},
    food(x,y){L.items.push({type:FOODS[fi++%FOODS.length],x:x*TS+4,y:y*TS+8,food:true});},
    green(x,y){L.items.push({type:'green',x:x*TS+4,y:y*TS+8});},
    box(x,y,content){set(x,y,'q');L.boxes[x+','+y]=content;},
    haz(type,x){const [hw,hh,msg]=HZ[type];L.haz.push({type,x:x*TS+(TS-hw)/2,y:GROUND-hh,w:hw,h:hh,msg});},
    enemy(type,x1,x2){const [ew,eh,sp,msg]=DIMS[type];L.ents.push({type,x:x1*TS,y:GROUND-eh,w:ew,h:eh,vx:sp,minX:x1*TS,maxX:x2*TS,state:'walk',t:Math.random()*5,msg});},
    bed(x,row,kid,bunk){L.beds.push({x:x*TS,y:row*TS-12,w:32,h:12,kid,bunk,awake:false,legH:(ROWS-1-row)*TS});},
    car(x,col){for(let i=0;i<3;i++)set(x+i,ROWS-2,'c');L.deco.push({type:'car',x,y:ROWS-2,col});},
    exit(x){L.exit={x:x*TS+4,y:GROUND-32,w:10,h:32};if(def.theme==='casa')L.deco.push({type:'door',x,y:(GROUND-32)/TS});}
  };
  def.build(A);
  if(def.theme==='calle'){
    L.followers=[0,1];
    L.blds=[];let bx=-40;while(bx<w*TS*.5+VW){const bw=40+Math.random()*40|0,bh=50+Math.random()*70|0;L.blds.push({x:bx,w:bw,h:bh,col:pick(['#f2b880','#e8a1a1','#a9c7e8','#c7b6e8','#f2d680'])});bx+=bw+4+(Math.random()*10|0);}
    L.clouds=[];for(let i=0;i<14;i++)L.clouds.push({x:i*70+Math.random()*40,y:8+Math.random()*40});
  }
  return L;
}

function platformLevel(id,done){
  const L=buildLevel(LEVELS[id]);
  const P=HEROES[G.hero]||HEROES.mama;
  stage.innerHTML=`<div class="plat"><canvas class="pix" width="${VW}" height="${VH}"></canvas>
    <div class="pad"><div><button data-k="l" aria-label="Izquierda">◀</button><button data-k="r" aria-label="Derecha">▶</button></div><button data-k="j" class="jb" aria-label="Saltar">⤴</button></div>
    <p class="keys">← → correr · Espacio o ↑ saltar</p><p class="rot">📱↻ Mejor con el móvil en horizontal</p></div>`;
  const c=stage.querySelector('canvas'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
  const fit=()=>{
    const pad=stage.querySelector('.pad'),keys=stage.querySelector('.keys');
    const aw=stage.clientWidth-24,ah=stage.clientHeight-24-(pad.offsetHeight||0)-(keys.offsetHeight||0)-20;
    const s=Math.max(1,Math.min(aw/VW,ah/VH));c.style.width=Math.floor(VW*s)+'px';c.style.height=Math.floor(VH*s)+'px';
  };
  fit();G.resize=fit;

  // ---- controles ----
  const inp={l:false,r:false,j:false};let jumpBuf=0;
  stage.querySelectorAll('.pad button').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{e.preventDefault();inp[k]=true;if(k==='j')jumpBuf=.15;};
    const off=e=>{e.preventDefault();inp[k]=false;};
    b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));
  });
  c.addEventListener('pointerdown',e=>{e.preventDefault();jumpBuf=.15;});
  G.onKey=k=>{if([' ','ArrowUp','w','W'].includes(k))jumpBuf=.15;};
  const K=G.keys;
  const left=()=>inp.l||K.ArrowLeft||K.a||K.A,right=()=>inp.r||K.ArrowRight||K.d||K.D,jumpHeld=()=>inp.j||K[' ']||K.ArrowUp||K.w||K.W;

  // ---- jugador ----
  const p={x:L.start*TS,y:GROUND-18,w:10,h:18,vx:0,vy:0,f:1,onG:false,coy:0,run:0,inv:0,coffee:0,cut:false,safeX:L.start*TS,safeY:GROUND-18};
  let cam=0,t=0,finished=false,nagT=0,shakeT=0,lineT=1.5;
  const tile=(tx,ty)=>{if(tx<0||tx>=L.w)return 'x';if(ty<0||ty>=ROWS)return '.';return L.rows[ty][tx];};
  const say=(txt,x,y,col)=>L.texts.push({txt,x,y,t:1,col});
  const puff=(x,y,col)=>{for(let i=0;i<8;i++)L.parts.push({x,y,vx:rnd(-60,60),vy:rnd(-90,-20),t:rnd(.3,.6),col:col||'#fff'});};
  const hurt=msg=>{
    if(p.inv>0)return;
    addMin(1,msg);p.inv=1.4;p.vy=-170;p.vx=-p.f*110;shakeT=.25;say('+1 MIN',p.x-6,p.y-10,'#ff6b6b');
  };
  const bump=(tx,ty)=>{
    L.rows[ty][tx]='u';sfx('good');
    const what=L.boxes[tx+','+ty]||'coffee';
    L.items.push({type:what,x:tx*TS+4,y:ty*TS,pop:.2});
    puff(tx*TS+8,ty*TS,'#ffd23f');
  };
  const wake=b=>{
    if(b.awake)return;b.awake=true;L.followers.push(b.kid);
    sfx('win');puff(b.x+10,b.y,'#ffd23f');say('¡VOY!',b.x+4,b.y-14,'#ffd23f');
    toast('⏰ ¡'+G.names[b.kid]+' se ha despertado!','good');
  };
  function moveX(dx){
    p.x+=dx;const t0=Math.floor(p.y/TS),t1=Math.floor((p.y+p.h-.01)/TS);
    if(dx>0){const tx=Math.floor((p.x+p.w-.01)/TS);for(let ty=t0;ty<=t1;ty++)if(SOLID.has(tile(tx,ty))){p.x=tx*TS-p.w;p.vx=0;return;}}
    else if(dx<0){const tx=Math.floor(p.x/TS);for(let ty=t0;ty<=t1;ty++)if(SOLID.has(tile(tx,ty))){p.x=(tx+1)*TS;p.vx=0;return;}}
  }
  function moveY(dy){ // devuelve true si choca
    const pb=p.y+p.h;p.y+=dy;
    const l=Math.floor(p.x/TS),r=Math.floor((p.x+p.w-.01)/TS);
    if(dy>0){
      const ty=Math.floor((p.y+p.h-.01)/TS);
      for(let tx=l;tx<=r;tx++){const ch=tile(tx,ty);if(SOLID.has(ch)||(ch==='='&&pb<=ty*TS+.5)){p.y=ty*TS-p.h;p.vy=0;p.onG=true;return true;}}
      for(const b of L.beds){if(pb<=b.y+1&&p.y+p.h>=b.y&&p.x+p.w>b.x+3&&p.x<b.x+b.w-3){p.y=b.y-p.h;p.vy=-400;p.cut=false;sfx('jump');wake(b);return true;}}
    }else if(dy<0){
      const ty=Math.floor(p.y/TS);
      for(let tx=l;tx<=r;tx++){const ch=tile(tx,ty);if(SOLID.has(ch)){p.y=(ty+1)*TS;p.vy=0;if(ch==='q')bump(tx,ty);return true;}}
    }
    return false;
  }

  function update(dt){
    t+=dt;
    // horizontal
    const dir=(right()?1:0)-(left()?1:0);
    if(dir)p.f=dir;
    const sp=p.coffee>0?128:88,acc=p.onG?900:620;
    const target=p.inv>1.1?p.vx:dir*sp;
    if(p.vx<target)p.vx=Math.min(target,p.vx+acc*dt);else if(p.vx>target)p.vx=Math.max(target,p.vx-acc*dt);
    // salto
    jumpBuf-=dt;p.coy=p.onG?.1:p.coy-dt;
    if(jumpBuf>0&&p.coy>0){p.vy=-300;p.coy=0;jumpBuf=0;p.cut=true;p.onG=false;sfx('jump');}
    if(p.cut&&!jumpHeld()&&p.vy<0){p.vy*=.45;p.cut=false;}
    p.vy=Math.min(400,p.vy+900*dt);
    // mover con subpasos
    let dx=p.vx*dt,n=Math.ceil(Math.abs(dx)/6)||1;for(let i=0;i<n;i++)moveX(dx/n);
    p.onG=false;
    let dy=p.vy*dt;n=Math.ceil(Math.abs(dy)/6)||1;for(let i=0;i<n;i++){if(moveY(dy/n))break;}
    if(p.onG){const ty=Math.floor((p.y+p.h)/TS);if(SOLID.has(tile(Math.floor(p.x/TS),ty))&&SOLID.has(tile(Math.floor((p.x+p.w)/TS),ty))){p.safeX=p.x;p.safeY=p.y;}}
    p.run+=Math.abs(p.vx)*dt*.18;
    p.inv=Math.max(0,p.inv-dt);p.coffee=Math.max(0,p.coffee-dt);shakeT=Math.max(0,shakeT-dt);
    // caída en zanja
    if(p.y>VH+20){
      addMin(2,pick(['¡Al hoyo de las obras! 🚧','¡Cuidado con la zanja! 🚧']));
      p.x=p.safeX-8;p.y=p.safeY-4;p.vx=0;p.vy=0;p.inv=1.4;
    }
    // enemigos
    L.ents.forEach(e=>{
      e.t+=dt;
      if(e.state==='flee'){e.x+=e.vx*dt;return;}
      if(e.state==='walk'){
        e.x+=e.vx*dt;
        if(e.x<e.minX){e.x=e.minX;e.vx=Math.abs(e.vx);}
        if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.vx=-Math.abs(e.vx);}
      }
      if(e.state!=='walk'||!overlap(p,e))return;
      if(p.vy>0&&p.y+p.h-e.y<9){
        if(e.type==='cat'){e.state='flee';e.vx=(p.x<e.x?1:-1)*170;say('¡MIAU!',e.x,e.y-12);}
        else if(e.type==='dog'){e.state='happy';say('¡GUAU!',e.x,e.y-12,'#ffd23f');}
        else say('¡PERDÓN!',e.x,e.y-12);
        p.vy=e.type==='stroller'?-260:-230;p.cut=false;sfx('good');puff(e.x+e.w/2,e.y);
      }else hurt(e.msg);
    });
    L.ents=L.ents.filter(e=>e.state!=='flee'||Math.abs(e.x-p.x)<400);
    // peligros
    L.haz.forEach(h=>{if(overlap(p,{x:h.x+1,y:h.y,w:h.w-2,h:h.h}))hurt(h.msg);});
    // objetos
    L.items.forEach(it=>{
      if(it.taken)return;
      if(it.pop>0){it.pop-=dt;it.y-=40*dt;return;}
      const hb=it.type==='green'?{x:it.x,y:it.y-4,w:8,h:12}:{x:it.x,y:it.y,w:8,h:8};
      if(!overlap(p,hb))return;
      it.taken=true;puff(it.x+4,it.y+4,'#ffd23f');
      if(it.food){L.food++;sfx('good');say(L.food+'/'+L.need,it.x-4,it.y-10,'#7cff7c');}
      else if(it.type==='coffee'){p.coffee=7;sfx('win');toast('☕ ¡Café! Corres más rápido','good');}
      else if(it.type==='green'){bonusMin(1,'¡Semáforo verde!');}
    });
    lineT-=dt;if(lineT<=0&&Math.abs(p.vx)>20){lineT=rnd(5,8);say(pick(P.lines),p.x-30,p.y-14,'#ffd23f');}
    // salida
    if(!finished&&L.exit&&overlap(p,L.exit)){
      const asleep=L.beds.filter(b=>!b.awake).length;
      if(asleep&&t>nagT){nagT=t+2;toast('😴 ¡Faltan niños! Salta en sus camas','bad');sfx('bad');}
      else if(!asleep&&L.food<L.need&&t>nagT){nagT=t+2;toast(`🥣 ¡Falta desayunar! ${L.food}/${L.need}`,'bad');sfx('bad');}
      else if(!asleep&&L.food>=L.need){finished=true;sfx('bell');say('¡VAMOS!',p.x-8,p.y-14,'#7cff7c');setTimeout(done,700);}
    }
    // estela para los niños
    L.trail.push({x:p.x,y:p.y,f:p.f,run:p.run,air:!p.onG});if(L.trail.length>90)L.trail.shift();
    L.parts.forEach(q=>{q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;});L.parts=L.parts.filter(q=>q.t>0);
    L.texts.forEach(q=>{q.t-=dt;q.y-=20*dt;});L.texts=L.texts.filter(q=>q.t>0);
    cam=Math.round(Math.max(0,Math.min(L.w*TS-VW,p.x+p.w/2-VW*.4)));
  }

  function drawBg(){
    if(L.theme==='casa'){
      ROOMS.forEach(r=>{
        const sx=r.x0*TS-cam,w=(r.x1-r.x0)*TS;if(sx>VW||sx+w<0)return;
        rect(ctx,sx,0,w,GROUND,r.col);
        for(let yy=6;yy<GROUND-8;yy+=16)for(let xx=sx+(yy/16%2?12:4);xx<sx+w;xx+=16)if(xx>-2&&xx<VW)rect(ctx,xx,yy,2,2,r.dot);
        rect(ctx,sx,GROUND-5,w,5,'#7a4a2a');
        ptext(ctx,r.name,sx+8,18,'rgba(255,255,255,.9)');
      });
    }else{
      rect(ctx,0,0,VW,GROUND,'#8fd3ff');rect(ctx,VW-40,10,16,16,'#ffe066');
      L.clouds.forEach(cl=>{const x=((cl.x-cam*.2)%1000+1000)%1000-60;rect(ctx,x,cl.y,30,8,'#fff');rect(ctx,x+6,cl.y-5,16,6,'#fff');});
      L.blds.forEach(b=>{const sx=Math.round(b.x-cam*.5);if(sx>VW||sx+b.w<0)return;
        rect(ctx,sx,GROUND-b.h,b.w,b.h,b.col);rect(ctx,sx,GROUND-b.h,b.w,3,'rgba(0,0,0,.15)');
        for(let wy=GROUND-b.h+8;wy<GROUND-14;wy+=14)for(let wx=sx+6;wx<sx+b.w-8;wx+=12)rect(ctx,wx,wy,6,8,(wx+wy)%3?'#fff6c7':'#7fb0d6');});
    }
  }
  function draw(){
    ctx.save();
    if(shakeT)ctx.translate(Math.round(rnd(-3,3)),0);
    drawBg();
    L.deco.forEach(d=>{if(d.type!=='car'&&d.type!=='door')drawDeco(ctx,d,cam,t);});
    const t0=Math.max(0,Math.floor(cam/TS)),t1=Math.min(L.w-1,Math.floor((cam+VW)/TS)+1);
    for(let ty=0;ty<ROWS;ty++)for(let tx=t0;tx<=t1;tx++){
      const ch=L.rows[ty][tx],sx=tx*TS-cam,sy=ty*TS;
      if(ch!=='.')drawTile(ctx,ch,sx,sy,L.theme,tx,L);
      else if(ty===ROWS-1){rect(ctx,sx,sy,16,16,'#2a1f1a');rect(ctx,sx,sy,16,2,(tx%2)?'#ffd23f':INK);}
    }
    L.deco.forEach(d=>{if(d.type==='car'||d.type==='door')drawDeco(ctx,d,cam,t);});
    L.beds.forEach(b=>drawBed(ctx,b,b.x-cam,b.y,t));
    L.items.forEach(it=>{if(!it.taken)drawItem(ctx,it.type,it.x-cam,it.y,t);});
    L.haz.forEach(h=>drawHaz(ctx,h,h.x-cam,h.y));
    L.ents.forEach(e=>{
      const f=e.vx>=0?1:-1,x=e.x-cam;
      if(e.type==='cat')drawCat(ctx,x,e.y,f,e.state==='walk'?e.t:e.t*2);
      else if(e.type==='dog')drawDog(ctx,x,e.y,f,e.t,e.state==='happy');
      else drawStroller(ctx,x,e.y,f,e.t);
    });
    L.followers.forEach((ki,i)=>{
      const tr=L.trail[Math.max(0,L.trail.length-1-(i+1)*12)];
      if(tr)drawKid(ctx,tr.x+1-cam,tr.y+6,tr.f,tr.run,tr.air,KIDPAL[ki]);
    });
    if(!(p.inv>0&&(t*14|0)%2))drawHero(ctx,Math.round(p.x-1-cam),Math.round(p.y),p.f,p.run,!p.onG,P);
    if(p.coffee>0&&(t*10|0)%2)rect(ctx,p.x-cam-4,p.y+14,3,1,'#fff');
    L.parts.forEach(q=>rect(ctx,q.x-cam,q.y,2,2,q.col));
    L.texts.forEach(q=>ptext(ctx,q.txt,q.x-cam,q.y,q.col));
    ctx.restore();
    // HUD
    rect(ctx,0,0,VW,13,'rgba(27,20,36,.75)');
    let hx=4;
    if(L.theme==='casa'){
      drawItem(ctx,'toast',hx,2,0);ptext(ctx,L.food+'/'+L.need,hx+11,3,L.food>=L.need?'#7cff7c':'#fff');hx+=58;
      L.beds.forEach(b=>{const kp=KIDPAL[b.kid];rect(ctx,hx,3,6,6,b.awake?SK:'#777');rect(ctx,hx,3,6,2,b.awake?kp.hair:'#555');if(!b.awake)ptext(ctx,'z',hx+7,1,'#bbb');hx+=16;});
    }else{
      L.followers.forEach(ki=>{const kp=KIDPAL[ki];rect(ctx,hx,3,6,6,SK);rect(ctx,hx,3,6,2,kp.hair);hx+=10;});
    }
    if(p.coffee>0){drawItem(ctx,'coffee',VW-60,2,0);rect(ctx,VW-48,5,40,4,'#555');rect(ctx,VW-48,5,40*p.coffee/7,4,'#c98a52');}
    const ex=L.exit?L.exit.x:0,prog=Math.min(1,p.x/ex);
    rect(ctx,110,5,90,3,'#555');rect(ctx,110,5,90*prog,3,'#7cff7c');rect(ctx,110+90*prog-1,3,3,7,'#fff');
  }
  G.tick=dt=>{update(dt);draw();};
}

// ===== MINIJUEGO: vestirse =====
function phaseDress(done){
  const SEQ=[['👕','camiseta'],['👖','pantalón'],['🧦','calcetines'],['👟','zapatillas'],['🧥','abrigo'],['🎒','mochila']];
  const DIS=[['🩱','bañador'],['🎃','disfraz de calabaza'],['🩴','chanclas'],['🤿','gafas de bucear'],['👑','corona'],['🦺','chaleco de obra'],['🎩','chistera'],['🩰','zapatillas de ballet']];
  let k=0,step=0,sockEvent=false,finished=false;
  const render=()=>{
    const opts=shuffle([...SEQ,...shuffle(DIS).slice(0,6)]);
    stage.innerHTML=`<div class="dress"><div class="avatar">${KID_EMO[k]}</div><div class="who">Vistiendo a <b>${esc(G.names[k])}</b></div>
      <div class="checklist">${SEQ.map((s,i)=>`<span class="${i<step?'done':i===step?'now':''}">${s[0]}</span>`).join('')}</div>
      <div class="grid">${opts.map(o=>`<button data-e="${o[0]}">${o[0]}</button>`).join('')}</div></div>`;
    stage.querySelectorAll('.grid button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();choose(b.dataset.e,b);});
  };
  const choose=(e,b)=>{
    if(finished)return;
    const want=SEQ[step];
    if(e===want[0]){
      sfx('good');step++;
      if(k===1&&step===4&&!sockEvent){sockEvent=true;step=2;setTimeout(()=>{toast('🙈 ¡'+G.names[1]+' se ha quitado zapatillas y calcetines!','bad');sfx('bad');shake();},150);}
      if(step>=SEQ.length){k++;step=0;
        if(k>=G.names.length){finished=true;done();return;}
        toast('✅ ¡Hecho! Ahora le toca a '+G.names[k],'good');}
      render();
    }else{
      const inSeq=SEQ.find(x=>x[0]===e);
      if(inSeq)addMin(1,'¡Todavía no! Primero: '+want[1]);
      else addMin(1,'¿Al cole con '+DIS.find(x=>x[0]===e)[1]+'? 🙄');
      b.classList.add('wrong');
    }
  };
  render();
}

// ===== MINIJUEGO: asearse (dientes, cara y pelo) =====
function phaseWash(done){
  const {c,ctx,toLocal}=makeCanvas();
  const TASKS=[
    {key:'dientes',tool:'🪥',title:'Dientes',need:6,dirt:['🦠','🦠','🍬','🍫'],msg:'✨ ¡Dientes brillantes!',hint:'¡Frota sobre los bichos!',
     spots:(()=>{const a=[];for(let i=0;i<6;i++){a.push({x:85+i*46,y:270});a.push({x:85+i*46,y:370});}return a;})()},
    {key:'cara',tool:'🧽',title:'Cara',need:5,dirt:['🍫','🍓','🟤','🥛'],msg:'😊 ¡Cara limpita!',hint:'¡Limpia las manchas de la cara!',
     spots:[{x:150,y:250},{x:250,y:250},{x:200,y:300},{x:140,y:340},{x:260,y:340},{x:200,y:390},{x:200,y:200},{x:120,y:290},{x:280,y:290}]},
    {key:'pelo',tool:'🪮',title:'Pelo',need:5,dirt:['🌀','🌀','〰️','🪶'],msg:'💇 ¡Bien peinado!',hint:'¡Peina los enredos!',
     spots:[{x:110,y:230},{x:160,y:190},{x:200,y:175},{x:240,y:190},{x:290,y:230},{x:130,y:280},{x:270,y:280},{x:200,y:225}]},
  ];
  let k=0,ti=0,cleaned=0,bx=W/2,by=H/2,dirt=[],foam=[],finished=false,busy=false,lastX=null,lastY=null,t=0;
  const task=()=>TASKS[ti];
  const spawn=()=>{const free=task().spots.filter(s=>!dirt.some(d=>d.s===s));if(!free.length)return;dirt.push({s:pick(free),hp:100,e:pick(task().dirt)});};
  const reset=()=>{dirt=[];cleaned=0;for(let i=0;i<3;i++)spawn();};
  reset();
  const scrub=(x,y)=>{
    if(lastX!==null&&!busy){
      const d=Math.hypot(x-lastX,y-lastY);
      dirt.forEach(g=>{if(Math.hypot(g.s.x-x,g.s.y-y)<48){g.hp-=d*.9;if(Math.random()<.3)foam.push({x:g.s.x+rnd(-25,25),y:g.s.y+rnd(-25,25),t:.8});}});
    }
    lastX=x;lastY=y;
  };
  c.addEventListener('pointermove',e=>{const p=toLocal(e);bx=p.x;by=p.y;scrub(p.x,p.y);});
  c.addEventListener('pointerdown',e=>{const p=toLocal(e);bx=p.x;by=p.y;lastX=p.x;lastY=p.y;});
  const drawScene=()=>{
    const T=task();
    if(T.key==='dientes'){
      ctx.fillStyle='#b8323f';ctx.beginPath();ctx.ellipse(W/2,320,175,120,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e8606e';ctx.beginPath();ctx.ellipse(W/2,345,110,45,0,0,Math.PI*2);ctx.fill();
      T.spots.forEach(s=>{ctx.fillStyle='#fffdf5';ctx.beginPath();ctx.roundRect(s.x-20,s.y-26,40,52,10);ctx.fill();});
    }else{
      // cara grande
      ctx.fillStyle='#ffd7b0';ctx.beginPath();ctx.arc(W/2,300,140,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2b2340';ctx.beginPath();ctx.arc(150,275,12,0,Math.PI*2);ctx.arc(250,275,12,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#2b2340';ctx.lineWidth=6;ctx.beginPath();ctx.arc(W/2,330,40,.2*Math.PI,.8*Math.PI);ctx.stroke();
      ctx.fillStyle='#ff9f9f';ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(125,320,18,0,Math.PI*2);ctx.arc(275,320,18,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      // pelo
      ctx.fillStyle=k===0?'#6b3f1f':'#c98a3a';ctx.beginPath();ctx.ellipse(W/2,210,150,75,0,Math.PI,2*Math.PI);ctx.fill();
      if(T.key==='pelo'){ctx.beginPath();ctx.ellipse(W/2,230,160,90,0,Math.PI*1.05,Math.PI*1.95);ctx.fill();ctx.fillRect(60,200,40,110);ctx.fillRect(300,200,40,110);}
    }
  };
  G.tick=dt=>{
    t+=dt;
    const kv=520*dt;let moved=false;
    if(G.keys.ArrowLeft){bx-=kv;moved=true;}if(G.keys.ArrowRight){bx+=kv;moved=true;}
    if(G.keys.ArrowUp){by-=kv;moved=true;}if(G.keys.ArrowDown){by+=kv;moved=true;}
    bx=Math.max(40,Math.min(W-40,bx));by=Math.max(140,Math.min(470,by));
    if(moved)scrub(bx,by);
    dirt=dirt.filter(g=>{if(g.hp<=0){cleaned++;sfx('good');foam.push({x:g.s.x,y:g.s.y,t:1,big:true});return false;}return true;});
    const T=task();
    if(!busy&&dirt.length<3&&cleaned+dirt.length<T.need)spawn();
    foam.forEach(f=>f.t-=dt);foam=foam.filter(f=>f.t>0);
    // dibujo
    ctx.fillStyle='#d7f0ff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#bfe3fa';for(let y=0;y<H;y+=50)for(let x=(y/50%2)*25;x<W;x+=50)ctx.fillRect(x,y,25,25);
    label(ctx,KID_EMO[k]+' '+G.names[k]+' · '+T.title+' '+Math.min(cleaned,T.need)+'/'+T.need,W/2,36,24);
    // mini checklist de tareas
    TASKS.forEach((x,i)=>{ctx.globalAlpha=i<ti?1:i===ti?1:.35;emo(ctx,(i<ti?'✅':x.tool),W/2-50+i*50,82,30);ctx.globalAlpha=1;});
    drawScene();
    dirt.forEach(g=>{ctx.globalAlpha=Math.max(.3,g.hp/100);emo(ctx,g.e,g.s.x,g.s.y+Math.sin(t*6+g.s.x)*3,34);ctx.globalAlpha=1;});
    foam.forEach(f=>{ctx.globalAlpha=f.t;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x,f.y,f.big?22:9,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
    emo(ctx,T.tool,bx,by,64,Math.sin(t*20)*.15);
    label(ctx,T.hint,W/2,H-40,22,'#7b6cf6');
    if(!busy&&cleaned>=T.need){
      busy=true;sfx('win');toast(T.msg,'good');
      setTimeout(()=>{
        ti++;
        if(ti>=TASKS.length){ti=0;k++;if(k<G.names.length)toast('Ahora le toca a '+G.names[k]);}
        if(k>=G.names.length){if(!finished){finished=true;done();}return;}
        reset();busy=false;lastX=null;
      },700);
    }
  };
}

// ===== MINIJUEGO: tráfico (con gasolina) =====
function phaseTraffic(done){
  const {c,ctx,toLocal}=makeCanvas();
  const LX=[100,200,300],PY=H-110,CAR=Math.PI/2;
  let lane=1,px=200,obs=[],spawn=.6,prog=0,inv=0,scroll=0,finished=false,t=0;
  let fuel=70,empty=false,warned=false,fuelSpawn=2.5;
  let side=[];for(let i=0;i<9;i++)side.push({x:pick([24,376]),y:i*75,e:pick(['🌳','🌲','🏠','🏪','🌳','🏢'])});
  const refill=()=>{fuel=Math.min(100,fuel+9);sfx('tap');if(fuel>=100){empty=false;warned=false;toast('⛽ ¡Depósito lleno! ¡En marcha!','good');sfx('good');}};
  const move=d=>{if(empty)return;lane=Math.max(0,Math.min(2,lane+d));sfx('tap');};
  G.onKey=k=>{if(empty){if([' ','Enter','ArrowUp','ArrowLeft','ArrowRight'].includes(k))refill();return;}if(k==='ArrowLeft')move(-1);if(k==='ArrowRight')move(1);};
  let sx=null;
  c.addEventListener('pointerdown',e=>{if(empty){refill();sx=null;return;}sx=toLocal(e).x;});
  c.addEventListener('pointerup',e=>{if(empty||sx===null)return;const x=toLocal(e).x;if(Math.abs(x-sx)>30)move(x>sx?1:-1);else move(x<W/2?-1:1);sx=null;});
  const draw=()=>{
    ctx.fillStyle='#7cc96b';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#55555f';ctx.fillRect(50,0,300,H);
    ctx.fillStyle='#fff';ctx.fillRect(50,0,5,H);ctx.fillRect(345,0,5,H);
    for(let y=-80+scroll;y<H;y+=80){ctx.fillRect(147,y,6,40);ctx.fillRect(247,y,6,40);}
    side.forEach(s=>emo(ctx,s.e,s.x,s.y,38));
    if(prog>=93)emo(ctx,'🏫',200,60+(prog-93)*20,90);
    obs.forEach(o=>emo(ctx,o.e,LX[o.lane],o.y,o.kind==='car'?54:40,o.kind==='car'?CAR:0));
    if(!(inv&&Math.floor(t*12)%2))emo(ctx,'🚗',px,PY,60,CAR);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.roundRect(40,12,320,34,17);ctx.fill();
    ctx.fillStyle='#2bb673';ctx.beginPath();ctx.roundRect(70,24,260*prog/100,10,5);ctx.fill();
    emo(ctx,'🏠',58,29,22);emo(ctx,'🏫',342,29,22);emo(ctx,'🚗',70+260*prog/100,29,20);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(10,H-44,150,32,16);ctx.fill();
    emo(ctx,'⛽',30,H-28,20);
    ctx.fillStyle='#ddd';ctx.beginPath();ctx.roundRect(46,H-34,104,12,6);ctx.fill();
    ctx.fillStyle=fuel<25?(Math.floor(t*4)%2?'#e0412a':'#ff9f8f'):'#ffb020';
    ctx.beginPath();ctx.roundRect(46,H-34,104*fuel/100,12,6);ctx.fill();
    if(empty){
      ctx.fillStyle='rgba(43,35,64,.75)';ctx.fillRect(0,0,W,H);
      emo(ctx,'⛽',W/2,200,90);
      label(ctx,'¡Sin gasolina!',W/2,280,38,'#e0412a');
      label(ctx,'Toca rápido para llenar',W/2,320,24);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(80,350,240,30,15);ctx.fill();
      ctx.fillStyle='#ffb020';ctx.beginPath();ctx.roundRect(84,354,232*fuel/100,22,11);ctx.fill();
      label(ctx,Math.round(fuel)+'%',W/2,365,20);
    }
  };
  G.tick=dt=>{
    t+=dt;
    if(empty){draw();return;}
    const speed=260+prog*1.6;
    scroll=(scroll+speed*dt)%80;
    px+=(LX[lane]-px)*Math.min(1,dt*14);
    inv=Math.max(0,inv-dt);
    if(!finished){prog=Math.min(100,prog+dt*3.6);fuel=Math.max(0,fuel-dt*7);}
    if(fuel<25&&!warned){warned=true;toast('⚠️ ¡Reserva! Coge un bidón ⛽');}
    if(fuel<=0&&!finished){empty=true;sfx('bad');shake();toast('😱 ¡Nos hemos quedado sin gasolina!','bad');draw();return;}
    spawn-=dt;fuelSpawn-=dt;
    if(fuelSpawn<=0&&prog<90){fuelSpawn=rnd(3,4.5);obs.push({lane:Math.floor(rnd(0,3)),y:-40,e:'⛽',kind:'fuel',v:speed});}
    if(spawn<=0&&prog<93){
      spawn=Math.max(.38,rnd(.55,.95)-prog*.003);
      if(Math.random()<.14)obs.push({lane:Math.floor(rnd(0,3)),y:-40,e:'🟢',kind:'bonus',v:speed});
      else{
        const l=Math.floor(rnd(0,3));
        obs.push({lane:l,y:-50,e:pick(['🚗','🚙','🚌','🚕','🚚','🛵']),kind:'car',v:speed*rnd(.35,.6)});
        if(Math.random()<.25+prog*.004){const l2=(l+1+Math.floor(rnd(0,2)))%3;obs.push({lane:l2,y:-60-rnd(0,40),e:pick(['🚗','🚙','🚕']),kind:'car',v:speed*rnd(.35,.6)});}
      }
    }
    obs.forEach(o=>o.y+=o.v*dt);
    obs=obs.filter(o=>{
      if(Math.abs(LX[o.lane]-px)<45&&Math.abs(o.y-PY)<50){
        if(o.kind==='bonus'){bonusMin(1,'¡Semáforo verde!');return false;}
        if(o.kind==='fuel'){fuel=Math.min(100,fuel+45);warned=false;sfx('good');toast('⛽ ¡Gasolina!','good');return false;}
        if(!inv){addMin(2,pick(['¡Pii piii! ¡Frenazo!','¡Atasco monumental!','¡Uy, por poco!']));inv=1.5;return false;}
      }
      return o.y<H+60;});
    side.forEach(s=>{s.y+=speed*dt;if(s.y>H+40){s.y-=9*75;s.e=pick(['🌳','🌲','🏠','🏪','🌳','🏢']);}});
    draw();
    if(prog>=100&&!finished){finished=true;setTimeout(done,400);}
  };
}

// ===== MINIJUEGO: entrada al cole =====
function phaseGate(done){
  let k=0,pos=0,dir=1,speed=1.1,zone,finished=false,busy=false;
  const newZone=()=>{const w=.24-k*.06;zone={a:rnd(.08,.92-w),w};};
  const render=()=>{
    stage.innerHTML=`<div class="gate"><div class="school">🏫</div>
      <div class="kids">${G.names.map((n,i)=>`<div class="gk ${i<k?'gone':''} ${i===k?'cur':''}"><div class="e">${KID_EMO[i]}</div><div>${esc(n)}</div></div>`).join('')}</div>
      <p class="who">Beso de despedida para <b>${esc(G.names[k])}</b> 😘</p>
      <div class="bar"><div class="zone"></div><div class="needle"></div></div>
      <button class="btn" id="kiss">😘 ¡Beso!</button></div>`;
    const z=stage.querySelector('.zone');z.style.left=zone.a*100+'%';z.style.width=zone.w*100+'%';
    $('#kiss').onpointerdown=e=>{e.preventDefault();attempt();};
  };
  const attempt=()=>{
    if(busy||finished)return;
    if(pos>=zone.a&&pos<=zone.a+zone.w){
      sfx('good');busy=true;
      const el=stage.querySelectorAll('.gk')[k];floatAt(el,pick(['¡Adiós! 👋','¡Te quiero!','¡Hasta luego!']),'#2b2340');
      setTimeout(()=>el.classList.add('run'),200);
      k++;
      setTimeout(()=>{busy=false;if(k>=G.names.length){finished=true;sfx('bell');done();}else{speed+=.4;newZone();render();}},900);
    }else addMin(1,pick(['«¡No me quiero ir!» 🤗 Abrazo extra','«¡Se me olvidó el almuerzo!»','«¡Otro beso!» 😚']));
  };
  G.onKey=key=>{if(key===' '||key==='Enter')attempt();};
  newZone();render();
  G.tick=dt=>{
    if(busy)return;
    pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1;}if(pos<0){pos=0;dir=1;}
    const n=stage.querySelector('.needle');if(n)n.style.left=`calc(${pos*100}% - 4px)`;
  };
}

// ===== flujo del juego =====
const PHASES=[
  {name:'Nivel 1 · La casa',icon:'🏠',how:'¡Corre por la casa! Salta encima de las camas para despertar a los peques (¡rebotan como camas elásticas!) y recoge 6 cosas del desayuno. Ojo con los Legos, la leche derramada y el gato. Las cajas ? esconden café.',ctrl:'← → correr · Espacio o ↑ saltar · en móvil, botones',fn:d=>platformLevel('casa',d)},
  {name:'¡A asearse!',icon:'🧼',how:'Toca dejarles como un pincel: cepilla los dientes 🪥, limpia la cara 🧽 y peina los enredos 🪮. Frota encima de cada mancha.',ctrl:'👆 Arrastra y frota · ⬅️ ⬆️ ⬇️ ➡️',fn:phaseWash},
  {name:'¡A vestirse!',icon:'👕',how:'Ropa en orden: camiseta, pantalón, calcetines, zapatillas, abrigo y mochila. ¡Nada de disfraces!',ctrl:'👆 Toca la prenda que toca',fn:phaseDress},
  {name:'En coche',icon:'🚗',how:'¡Hora punta! Esquiva coches y autobuses. Los semáforos verdes 🟢 te devuelven tiempo y los bidones ⛽ llenan el depósito. ¡Si te quedas sin gasolina, toca rápido para repostar!',ctrl:'⬅️ ➡️ · toca izquierda o derecha',fn:phaseTraffic},
  {name:'Nivel 2 · La calle',icon:'🚶',how:'Del coche a la puerta del cole con los peques detrás. Salta zanjas de obras, charcos y cacas de perro. Pisa a los perros y se ponen a jugar. ¡Los semáforos verdes te devuelven tiempo!',ctrl:'← → correr · Espacio o ↑ saltar · en móvil, botones',fn:d=>platformLevel('calle',d)},
  {name:'Entrada al cole',icon:'🏫',how:'Dale el beso de despedida cuando la aguja esté en la zona verde. ¡Si fallas, abrazo extra!',ctrl:'👆 Botón · barra espaciadora',fn:phaseGate},
];

function runPhase(i){
  G.tick=null;G.onKey=null;G.resize=null;stage.className='';
  if(i>=PHASES.length)return end();
  const p=PHASES[i];
  $('#phaseName').textContent=p.icon+' '+(i+1)+'/'+PHASES.length;
  stage.innerHTML=`<div class="card"><div class="big">${p.icon}</div><h2>${p.name}</h2><p>${p.how}</p><p class="ctrl">${p.ctrl}</p><p style="font-size:14px;opacity:.6">El reloj está parado hasta que pulses</p><button class="btn" id="go">¡Vamos!</button></div>`;
  $('#go').onclick=()=>{
    sfx('tap');stage.innerHTML='';G.running=true;let fin=false;
    p.fn(()=>{if(fin)return;fin=true;G.running=false;G.tick=null;G.onKey=null;sfx('win');confetti();setTimeout(()=>runPhase(i+1),900);});
  };
}

function start(){
  G.clock=START;G.penalty=0;G.bonus=0;
  $('#hud').classList.remove('hidden');updClock();
  runPhase(0);
}

function end(){
  G.running=false;$('#phaseName').textContent='🏁';
  const arr=Math.floor(G.clock),diff=BELL-arr,t=fmt(arr);
  let stars,title,msg;
  if(diff>=10){stars=3;title='¡Familia puntual!';msg=`Llegáis a las <b>${t}</b>, ¡${diff} minutos antes de la campana! Hasta el conserje aplaude 👏`;}
  else if(diff>=0){stars=2;title='¡Por los pelos!';msg=`Entráis a las <b>${t}</b>. La puerta se cerraba detrás… ¡pero dentro!`;}
  else{stars=1;title='¡Llegamos tarde!';msg=`Son las <b>${t}</b>, ${-diff} min tarde. Toca firmar en conserjería ✍️ ¡Mañana lo bordáis!`;}
  let best=null,record=false;
  try{best=parseInt(localStorage.getItem('cole-best-min'));if(isNaN(best)||arr<best){localStorage.setItem('cole-best-min',arr);record=!isNaN(best);best=arr;}}catch(e){}
  stage.innerHTML=`<div class="card"><div class="big">${stars>=2?'🏫🎉':'🏫😅'}</div><h1>${title}</h1>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${msg}</p>
    <div class="stats"><span>😬 +${G.penalty} min</span><span>🟢 −${G.bonus} min</span></div>
    ${record?'<p class="best">🏆 ¡Nuevo récord!</p>':best!==null?`<p class="best">🏆 Mejor llegada: ${fmt(best)}</p>`:''}
    <button class="btn" id="again">Otra mañana</button><button class="btn alt" id="menu">Menú</button></div>`;
  $('#again').onclick=start;$('#menu').onclick=menu;
  if(stars>=2)confetti();sfx(stars>=2?'win':'bad');
}

function menu(){
  G.running=false;G.tick=null;G.onKey=null;G.resize=null;stage.className='';
  $('#hud').classList.add('hidden');
  let best=null;try{best=parseInt(localStorage.getItem('cole-best-min'));}catch(e){}
  stage.innerHTML=`<div class="card"><h1>SCHOOL<br>RUSH</h1><p class="sub">¡Que llegamos tarde!</p>
    <p>Son las <b>7:45</b> y la puerta del cole cierra a las <b>9:00</b>. Despierta a los peques, desayuno, aseo, ropa, coche… ¡y a correr!</p>
    <p class="lbl">¿Quién lleva hoy a los niños?</p>
    <div class="heroes">${Object.keys(HEROES).map(h=>`<button class="hero ${G.hero===h?'sel':''}" data-h="${h}"><canvas width="16" height="20"></canvas><span>${HEROES[h].name}</span></button>`).join('')}</div>
    <div class="names"><label>👧<input id="n0" maxlength="12" value="${esc(G.names[0])}"></label><label>🧒<input id="n1" maxlength="12" value="${esc(G.names[1])}"></label></div>
    ${best&&!isNaN(best)?`<p class="best">🏆 Mejor llegada: ${fmt(best)}</p>`:''}
    <button class="btn" id="play">¡A JUGAR!</button></div>`;
  stage.querySelectorAll('.hero').forEach(b=>{
    const cc=b.querySelector('canvas').getContext('2d');drawHero(cc,2,1,1,0,false,HEROES[b.dataset.h]);
    b.onclick=()=>{G.hero=b.dataset.h;stage.querySelectorAll('.hero').forEach(x=>x.classList.toggle('sel',x===b));sfx('tap');};
  });
  $('#play').onclick=()=>{
    G.names=[$('#n0').value.trim()||'Peque 1',$('#n1').value.trim()||'Peque 2'];
    try{localStorage.setItem('cole-names',JSON.stringify(G.names));localStorage.setItem('cole-hero',G.hero);}catch(e){}
    sfx('tap');start();
  };
}
menu();
</script>
