<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e1838">
<title>School Rush · ¡Que llegamos tarde!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2340;--accent:#ff6b4a;--violet:#7b6cf6;--ok:#2bb673}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1e1838;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,24,56,.45);padding:10px}
.overlay.hidden{display:none}
.card{background:#fff;border-radius:28px;padding:18px 24px;text-align:center;width:min(560px,94%);max-height:96%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.25)}
h1{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(34px,7vw,58px);line-height:1;color:var(--accent);margin:4px 0;letter-spacing:1px;text-shadow:0 4px 0 var(--ink)}
.sub{font-weight:700;color:var(--violet);margin:2px 0 8px;font-size:18px}
.card p{margin:6px 0;font-size:16px}
.heroes{display:flex;gap:12px;justify-content:center;margin:8px 0}
.hero{border:4px solid #e7e1ff;background:#f7f5ff;border-radius:20px;padding:4px 10px 6px;cursor:pointer;font:inherit;font-weight:700;font-size:17px;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.hero canvas{width:110px;height:120px}
.hero.sel{border-color:var(--accent);background:#fff1ec}
.names{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.names input{font:inherit;font-size:16px;width:130px;padding:6px 10px;border-radius:14px;border:3px solid #e7e1ff;text-align:center}
.btn{font-family:'Lilita One',system-ui,sans-serif;font-size:24px;border:0;border-radius:999px;padding:10px 34px;background:var(--accent);color:#fff;box-shadow:0 6px 0 #c94a30;cursor:pointer;margin:8px 4px 2px;letter-spacing:1px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a30}
.btn.alt{background:var(--violet);box-shadow:0 6px 0 #5446c4;font-size:18px}
.how{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:600;margin:6px 0}
.how span{background:#f1ecff;border-radius:12px;padding:4px 10px}
.stars{font-size:46px;letter-spacing:6px;margin:2px 0}
.res{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:700;margin:6px 0}
.res span{background:#f7f5ff;border-radius:12px;padding:6px 12px}
.best{color:var(--violet);font-weight:700}
#mute{position:absolute;bottom:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(43,35,64,.55);color:#fff;font-size:20px;cursor:pointer;z-index:5}
#rot{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--violet);color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;display:none;z-index:10;font-size:14px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
@media (max-height:520px){
  .card{padding:10px 16px;border-radius:22px}
  h1{font-size:30px}.sub{font-size:15px;margin:0 0 4px}
  #menu .card>p:not(.best){display:none}
  .hero canvas{width:62px;height:68px}.hero{font-size:14px;padding:2px 8px 4px}
  .heroes{margin:4px 0}.names input{font-size:14px;width:110px;padding:4px 8px}
  .how{display:none}.btn{font-size:20px;padding:8px 28px;margin-top:4px}
  .stars{font-size:32px}.res{font-size:14px;gap:8px;margin:4px 0}
}
</style>
</head>
<body>
<div id="rot">📱↻ Gira el móvil para jugar mejor</div>
<div id="wrap">
  <div id="game">
    <canvas id="c"></canvas>
    <button id="mute" aria-label="Sonido">🔊</button>
    <div id="menu" class="overlay"></div>
    <div id="end" class="overlay hidden"></div>
  </div>
</div>

<script>
// =====================================================================
//  SCHOOL RUSH · ¡Que llegamos tarde!
// =====================================================================
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>{m=Math.floor(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};

const W=960,H=540,GY=440;
const START=8*60+40,BELL=9*60,SEC_PER_MIN=5.5;
const D=30000,B1=9000,B2=24000;           // longitud y fronteras casa|calle|cole
const PX=250;                              // posición de la mamá en pantalla
const OL='#2b2340';

const cvs=$('#c');let ctx=cvs.getContext('2d');
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}

const G={state:'menu',hero:'mama',names:['Sofía','Leo'],muted:false,t:0};
try{const n=JSON.parse(localStorage.getItem('sr-names'));if(Array.isArray(n)&&n.length===2)G.names=n;const h=localStorage.getItem('sr-hero');if(h==='mama'||h==='papa')G.hero=h;G.muted=localStorage.getItem('sr-muted')==='1';}catch(e){}

// ---------- tamaño ----------
let SC=1,DPR=1;
function fit(){
  const vw=innerWidth,vh=innerHeight,s=Math.min(vw/W,vh/H)*.985;SC=s;DPR=Math.min(2,devicePixelRatio||1);
  const g=$('#game');g.style.width=Math.round(W*s)+'px';g.style.height=Math.round(H*s)+'px';
  cvs.width=Math.round(W*s*DPR);cvs.height=Math.round(H*s*DPR);
}
addEventListener('resize',fit);fit();

// ---------- sonido ----------
let AC,master,musicGain,musicTimer=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=G.muted?0:1;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=.05;musicGain.connect(master);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f1,f2,d,type,vol,when){
  if(!AC)return;const t=(when||AC.currentTime);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';
  o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);
}
const SFX={
  jump:()=>tone(330,660,.14,'square',.08),
  jump2:()=>tone(520,1040,.16,'square',.08),
  coin:n=>tone(880*Math.pow(1.06,Math.min(n,12)),0,.09,'triangle',.12),
  hit:()=>{tone(220,80,.3,'sawtooth',.13);tone(110,60,.3,'square',.06);},
  power:()=>{tone(523,0,.1);setTimeout(()=>tone(659,0,.1),90);setTimeout(()=>tone(784,1046,.2),180);},
  tap:()=>tone(600,700,.05,'square',.06),
  land:()=>tone(140,90,.06,'triangle',.08),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0,.18),i*110));},
  bell:()=>{tone(1320,1300,.8,'sine',.12);setTimeout(()=>tone(1320,1300,.8,'sine',.1),350);},
  bad:()=>tone(200,120,.3,'sawtooth',.1),
};
const sfx=(k,a)=>{try{audio();SFX[k]&&SFX[k](a);}catch(e){}};
// música: bucle alegre de 2 compases
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const BASS=[48,48,55,55,53,53,55,55, 45,45,52,52,53,53,55,55];
const MEL =[72,0,76,79,0,76,72,74, 76,0,74,72,69,0,72,0, 72,0,76,79,0,81,79,76, 74,0,76,74,72,0,0,0];
let step=0;
function startMusic(){
  audio();if(!AC||musicTimer)return;
  const spb=60/150/2;let next=AC.currentTime+.05;
  musicTimer=setInterval(()=>{
    while(next<AC.currentTime+.2){
      const b=BASS[step%16],m=MEL[step%32];
      const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=NOTE(b-12);g.gain.setValueAtTime(.5,next);g.gain.exponentialRampToValueAtTime(.01,next+spb*.9);o.connect(g).connect(musicGain);o.start(next);o.stop(next+spb);
      if(m){const o2=AC.createOscillator(),g2=AC.createGain();o2.type='triangle';o2.frequency.value=NOTE(m);g2.gain.setValueAtTime(.7,next);g2.gain.exponentialRampToValueAtTime(.01,next+spb*.95);o2.connect(g2).connect(musicGain);o2.start(next);o2.stop(next+spb);}
      if(step%4===0){const o3=AC.createOscillator(),g3=AC.createGain();o3.type='sine';o3.frequency.setValueAtTime(150,next);o3.frequency.exponentialRampToValueAtTime(40,next+.1);g3.gain.setValueAtTime(.9,next);g3.gain.exponentialRampToValueAtTime(.01,next+.12);o3.connect(g3).connect(musicGain);o3.start(next);o3.stop(next+.13);}
      next+=spb;step++;
    }
  },50);
}
function stopMusic(){clearInterval(musicTimer);musicTimer=null;}
$('#mute').textContent=G.muted?'🔇':'🔊';
$('#mute').onclick=e=>{e.stopPropagation();G.muted=!G.muted;$('#mute').textContent=G.muted?'🔇':'🔊';if(master)master.gain.value=G.muted?0:1;try{localStorage.setItem('sr-muted',G.muted?'1':'0');}catch(e){}};

// =====================================================================
//  DIBUJO: utilidades
// =====================================================================
function shape(fill,lw){if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw!==0){ctx.lineWidth=lw||4;ctx.strokeStyle=OL;ctx.lineJoin='round';ctx.stroke();}}
function circ(x,y,r,fill,lw){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);shape(fill,lw);}
function ell(x,y,rx,ry,fill,lw,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);shape(fill,lw);}
function rr(x,y,w,h,r,fill,lw){ctx.beginPath();ctx.roundRect(x,y,w,h,r);shape(fill,lw);}
function seg(x1,y1,x2,y2,col,lw){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();}
function limb(x1,y1,x2,y2,col,lw){seg(x1,y1,x2,y2,OL,lw+7);seg(x1,y1,x2,y2,col,lw);}
function txt(s,x,y,size,fill,align,stroke){
  ctx.font=`${size}px 'Lilita One',system-ui,sans-serif`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=Math.max(4,size/5);ctx.strokeStyle=stroke||OL;ctx.strokeText(s,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);
}

// =====================================================================
//  PERSONAJES
// =====================================================================
const SKIN='#ffd2b0';
const HEROES={
  mama:{name:'Mamá',hair:'#6b2f1a',top:'#ff5d8f',dots:'#ffd1e0',belt:'#7b3fa0',leg:SKIN,shoe:'#e0244a',mom:true,
        lines:['¡Vamos, cariño!','¡Que llegamos tarde!','¿Y los zapatos?','¡Corre, corre!','¡La mochila!','¡Mis llaves!']},
  papa:{name:'Papá',hair:'#2d2016',top:'#3d7be0',bottom:'#2f3b66',leg:'#2f3b66',shoe:'#6b4423',tie:'#e0412a',
        lines:['¡Vamos, campeones!','¡Que llegamos tarde!','¿Quién tiene el almuerzo?','¡Corre, corre!','¡Ese abrigo!']}
};
const KIDS=[{hair:'#e0702a',top:'#ffd23f',bottom:'#7b6cf6',bag:'#2bb673',pig:true},{hair:'#4a2a14',top:'#2bb673',bottom:'#3d7be0',bag:'#ff6b4a',bow:true}];

function legPose(state,ph,side){ // devuelve pie relativo a la cadera
  if(state==='jump')return side>0?{x:16,y:30}:{x:-14,y:34};
  if(state==='idle')return {x:side*7,y:44};
  const a=Math.sin(ph+(side>0?0:Math.PI))*.85;
  const lift=Math.max(0,Math.cos(ph+(side>0?0:Math.PI)))*12;
  return {x:Math.sin(a)*40,y:Math.cos(a)*44-lift};
}
function face(x,y,r,o,mom,kid){
  // ojos
  const ex=[x+r*.28,x+r*.74],ey=y-r*.05,er=r*(kid?.2:.17);
  if(o.blink){ex.forEach(e=>seg(e-er,ey,e+er,ey,OL,3));}
  else ex.forEach(e=>{ell(e,ey,er,er*1.25,'#fff',2.5);circ(e+er*.35,ey+er*.15,er*.55,OL,0);circ(e+er*.1,ey-er*.35,er*.22,'#fff',0);});
  if(mom&&!o.blink)ex.forEach(e=>{seg(e+er*.5,ey-er*1.2,e+er*1.1,ey-er*1.7,OL,2.5);seg(e+er*.9,ey-er*.8,e+er*1.5,ey-er*1.2,OL,2.5);});
  // mofletes
  ctx.globalAlpha=.45;circ(x+r*.12,y+r*.35,r*.16,'#ff7b9c',0);circ(x+r*.92,y+r*.33,r*.14,'#ff7b9c',0);ctx.globalAlpha=1;
  // boca
  const mx=x+r*.55,my=y+r*.42;
  if(o.face==='ouch'){ctx.beginPath();ctx.ellipse(mx,my+2,r*.16,r*.2,0,0,Math.PI*2);shape('#7a1f2b',2.5);}
  else if(o.face==='open'){ctx.beginPath();ctx.moveTo(mx-r*.22,my-2);ctx.quadraticCurveTo(mx,my+r*.42,mx+r*.24,my-2);ctx.closePath();shape('#7a1f2b',2.5);}
  else{ctx.beginPath();ctx.arc(mx,my-r*.08,r*.22,.15*Math.PI,.85*Math.PI);ctx.lineWidth=3;ctx.strokeStyle=OL;ctx.lineCap='round';ctx.stroke();}
  if(mom&&o.face!=='ouch'&&o.face!=='open'){ctx.beginPath();ctx.arc(mx,my-r*.08,r*.22,.25*Math.PI,.75*Math.PI);ctx.lineWidth=2;ctx.strokeStyle='#e0244a';ctx.stroke();}
}
function drawAdult(x,y,o){
  const P=HEROES[o.hero],ph=o.ph||0,st=o.state||'run',t=o.t||0;
  ctx.save();ctx.translate(x,y);ctx.scale(o.sx||1,o.sy||1);
  if(st==='duck'){ctx.scale(1.16,.56);}
  if(o.rot){ctx.translate(0,-60);ctx.rotate(o.rot);ctx.translate(0,60);}
  const bob=st==='run'?-Math.abs(Math.cos(ph))*5:0;ctx.translate(0,bob);
  const hip={x:0,y:-46};
  const sway=Math.sin(t*9)*5+(st==='jump'?-10:0);
  // pelo largo por detrás (mamá)
  if(P.mom){ctx.beginPath();ctx.moveTo(-14,-140);ctx.quadraticCurveTo(-52,-128+sway,-48+sway*.6,-84);ctx.quadraticCurveTo(-36,-92,-24,-96);ctx.quadraticCurveTo(-30,-112,-10,-112);ctx.closePath();shape(P.hair,4);}
  // mochila (papá)
  if(!P.mom)rr(-34,-98,20,40,8,'#e0412a',4);
  // pierna de atrás
  const fb=legPose(st,ph,-1),ff=legPose(st,ph,1);
  limb(hip.x-5,hip.y,hip.x-5+fb.x,hip.y+fb.y,P.mom?'#f0bd98':'#26304f',11);ell(hip.x-5+fb.x+5,hip.y+fb.y,11,6.5,P.shoe,3);
  // brazo de atrás
  const aa=st==='run'?Math.sin(ph)*.9:0;
  const back=st==='jump'?{x:-26,y:-126}:{x:-2+Math.sin(aa)*-28,y:-88+Math.cos(aa)*30};
  limb(-2,-88,back.x,back.y,'#f0bd98',9);
  // cuerpo
  if(P.mom){
    ctx.beginPath();ctx.moveTo(-16,-96);ctx.lineTo(16,-96);ctx.quadraticCurveTo(22,-70,32,-40);ctx.quadraticCurveTo(0,-30,-32,-40);ctx.quadraticCurveTo(-22,-70,-16,-96);ctx.closePath();shape(P.top,4);
    [[-14,-48],[8,-44],[18,-56],[-4,-60],[-20,-58]].forEach(d=>circ(d[0],d[1],2.6,P.dots,0));
    rr(-19,-74,38,7,3,P.belt,3);
  }else{
    rr(-19,-98,38,52,12,P.top,4);
    ctx.beginPath();ctx.moveTo(2,-96);ctx.lineTo(8,-80);ctx.lineTo(2,-62);ctx.lineTo(-4,-80);ctx.closePath();shape(P.tie,2.5);
    rr(-19,-52,38,10,4,P.bottom,4);
  }
  // pierna de delante
  limb(hip.x+5,hip.y,hip.x+5+ff.x,hip.y+ff.y,P.mom?SKIN:P.leg,11);ell(hip.x+5+ff.x+5,hip.y+ff.y,11,6.5,P.shoe,3);
  // bolso (mamá)
  if(P.mom){seg(4,-92,18,-62,OL,3);rr(8,-66,24,20,6,'#8b5cf6',3.5);rr(16,-62,8,4,2,'#ffd23f',0);}
  // brazo de delante
  const front=st==='jump'?{x:26,y:-128}:{x:2+Math.sin(aa)*28,y:-88+Math.cos(aa)*30};
  limb(2,-88,front.x,front.y,SKIN,9);circ(front.x,front.y,6,SKIN,3);
  // cabeza
  const hx=4,hy=-124,r=32;
  circ(hx,hy,r,SKIN,4);
  circ(hx-14,hy+4,7,SKIN,3);
  if(P.mom){
    ctx.beginPath();ctx.arc(hx,hy,r+2,Math.PI*.92,Math.PI*2.04);ctx.quadraticCurveTo(hx+26,hy-6,hx+14,hy-10);ctx.quadraticCurveTo(hx+2,hy-18,hx-8,hy-6);ctx.quadraticCurveTo(hx-18,hy+2,hx-24,hy+12);ctx.closePath();shape(P.hair,4);
    ctx.beginPath();ctx.arc(hx,hy,r+1,Math.PI*1.12,Math.PI*1.72);ctx.lineWidth=10;ctx.strokeStyle=OL;ctx.stroke();ctx.lineWidth=6;ctx.strokeStyle='#e0244a';ctx.stroke();
    circ(hx-14,hy+14,4,'#ffd23f',2);
  }else{
    ctx.beginPath();ctx.arc(hx,hy,r+2,Math.PI*.95,Math.PI*1.98);ctx.lineTo(hx+30,hy-14);ctx.quadraticCurveTo(hx+20,hy-20,hx+10,hy-14);ctx.quadraticCurveTo(hx-6,hy-22,hx-20,hy-6);ctx.closePath();shape(P.hair,4);
    ctx.globalAlpha=.28;ctx.beginPath();ctx.arc(hx,hy,r-2,.05*Math.PI,.75*Math.PI);ctx.closePath();shape(P.hair,0);ctx.globalAlpha=1;
  }
  face(hx-6,hy,r,o,P.mom,false);
  if(!P.mom){seg(hx+2,hy-14,hx+12,hy-16,OL,4);seg(hx+18,hy-16,hx+28,hy-14,OL,4);}
  ctx.restore();
}
function drawKid(x,y,o,K){
  ctx.save();ctx.translate(x,y);ctx.scale(.62,.62);
  if(o.rot){ctx.translate(0,-40);ctx.rotate(o.rot);ctx.translate(0,40);}
  const ph=o.ph||0,st=o.state||'run';
  const bob=st==='run'?-Math.abs(Math.cos(ph))*6:0;ctx.translate(0,bob);
  const fb=legPose(st,ph,-1),ff=legPose(st,ph,1);
  rr(-30,-100,24,36,8,K.bag,4);
  limb(-4,-46,-4+fb.x*.8,-46+fb.y,'#f0bd98',12);ell(-4+fb.x*.8+5,-46+fb.y,12,7,'#fff',3);
  const aa=st==='run'?Math.sin(ph)*.9:0;
  limb(-2,-88,-2-Math.sin(aa)*26,-88+Math.cos(aa)*28,'#f0bd98',10);
  rr(-20,-98,40,40,14,K.top,4);
  if(K.pig){ctx.beginPath();ctx.moveTo(-22,-62);ctx.lineTo(22,-62);ctx.lineTo(28,-42);ctx.lineTo(-28,-42);ctx.closePath();shape(K.bottom,4);}
  else rr(-20,-62,40,16,6,K.bottom,4);
  limb(4,-46,4+ff.x*.8,-46+ff.y,SKIN,12);ell(4+ff.x*.8+5,-46+ff.y,12,7,'#fff',3);
  limb(2,-88,2+Math.sin(aa)*26,-88+Math.cos(aa)*28,SKIN,10);
  const hx=2,hy=-128,r=36;
  if(K.pig){circ(hx-34,hy-6,13,K.hair,4);circ(hx+36,hy-10,11,K.hair,4);}
  circ(hx,hy,r,SKIN,4);
  ctx.beginPath();ctx.arc(hx,hy,r+2,Math.PI*.95,Math.PI*2.02);ctx.quadraticCurveTo(hx+20,hy-14,hx+6,hy-14);ctx.quadraticCurveTo(hx-12,hy-20,hx-26,hy+6);ctx.closePath();shape(K.hair,4);

  if(type==='scooter'){rr(x-20,y+6,40,7,3,'#ff5d8f',3);seg(x+14,y+6,x+12,y-20,OL,5);seg(x+6,y-20,x+20,y-20,OL,5);circ(x-14,y+16,6,'#4a4a5c',3);circ(x+16,y+16,6,'#4a4a5c',3);}
  else if(type==='umbrella'){ctx.beginPath();ctx.arc(x,y-2,22,Math.PI,0);ctx.closePath();shape('#7b6cf6',3);ctx.beginPath();ctx.arc(x,y-2,22,Math.PI,Math.PI*1.33);ctx.lineTo(x,y-2);ctx.closePath();shape('#ffd23f',0);seg(x,y-2,x,y+18,OL,4);ctx.beginPath();ctx.arc(x+5,y+18,5,Math.PI,0,true);ctx.lineWidth=4;ctx.stroke();}
  else{rr(x-14,y-10,24,26,6,'#fff',3.5);ctx.beginPath();ctx.arc(x+12,y+3,7,-Math.PI/2,Math.PI/2);ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();rr(x-12,y-8,20,6,3,'#7a3b1a',0);
    for(let i=0;i<2;i++){ctx.beginPath();ctx.moveTo(x-6+i*8,y-14);ctx.quadraticCurveTo(x-10+i*8,y-22-Math.sin(t*6+i)*3,x-4+i*8,y-30);ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}}
}
const POWERS={scooter:{name:'¡PATINETE!',dur:5,col:'#ff5d8f'},umbrella:{name:'¡PARAGUAS!',dur:8,col:'#7b6cf6'},coffee:{name:'¡CAFÉ TURBO!',dur:6,col:'#a85d23'}};

let R=null;
const inp={jumpBuf:0,duckHeld:false};
function newRun(){
  R={dist:0,speed:330,clock:START,score:0,streak:0,mult:1,hits:0,toasts:0,t:0,shake:0,
     p:{y:GY,vy:0,onG:true,jumps:0,sx:1,sy:1,ph:0,inv:0,face:'happy',faceT:0,rot:0,spin:0,blinkT:2},
     kids:[{dx:-110,trip:0},{dx:-200,trip:0}],hist:[],
     obs:[],items:[],parts:[],texts:[],power:null,moment:null,gen:900,nextPow:3500,lineT:3,
     moments:[{at:6200,type:'teeth',done:false},{at:16500,type:'light',done:false},{at:D,type:'gate',done:false}],
     banner:{txt:'¡CASA!',t:1.6},sec:'casa',end:false};
}
const speedAt=x=>330+Math.min(170,x/140);
function spawn(){
  while(R.gen<R.dist+W+700){
    const x=R.gen;
    const blocked=R.moments.some(m=>x>m.at-1100&&x<m.at+250)||[B1,B2].some(b=>x>b-450&&x<b+350)||x>D-1200;
    if(blocked){R.gen+=120;continue;}
    const sec=secAt(x);
    if(x>R.nextPow){R.items.push({kind:'power',type:pick(Object.keys(POWERS)),x:x,y:GY-170});R.nextPow=x+rnd(3800,5200);R.gen+=420;continue;}
    if(Math.random()<.16){for(let i=0;i<6;i++)R.items.push({kind:'toast',x:x+i*52,y:GY-60});R.gen+=420;continue;}
    const type=pick(POOL[sec]),def=OB[type];
    const o={type,x,w:def.w,h:def.h,t:0,vx:def.vx||0,y:GY-def.h};def.init&&def.init(o);R.obs.push(o);
    if(def.kind==='low'&&Math.random()<.65){const cx=x+def.w/2;for(let i=-2;i<=2;i++)R.items.push({kind:'toast',x:cx+i*46+(def.vx||0)*-.5,y:GY-80-(1-(i/2.4)**2)*95});}
    if(def.kind==='high'&&Math.random()<.6){for(let i=0;i<4;i++)R.items.push({kind:'toast',x:x+20+i*50,y:GY-36});}
    const gapS=Math.max(.8,1.25-x/50000);
    R.gen=x+def.w+speedAt(x)*gapS*rnd(1,1.7)+(def.vx?-def.vx*1.2:0);
  }
}
function say(s,x,y,col,size){R.texts.push({s,x,y,col:col||'#fff',t:1.1,size:size||26});}
function puff(x,y,col,n,sp){for(let i=0;i<(n||10);i++)R.parts.push({x,y,vx:rnd(-1,1)*(sp||160),vy:rnd(-1,.2)*(sp||160),t:rnd(.3,.7),r:rnd(3,7),col:col||'#fff'});}
function hit(o){
  const p=R.p;
  if(p.inv>0)return;
  if(R.power&&R.power.type==='scooter'){o.smash=1;o.vy=-500;sfx('tap');puff(PX,GY-60,'#ffd23f',14);R.score+=20;say('¡CRASH!',PX+40,GY-170,'#ffd23f');return;}
  R.clock+=1;R.hits++;R.streak=0;R.mult=1;p.inv=1.4;p.face='ouch';p.faceT=.9;R.shake=.35;
  sfx('hit');puff(PX+10,p.y-60,'#fff',14,220);
  say('+1 MIN',PX,p.y-190,'#ff6b6b',32);
  const k=[...R.kids].reverse().find(k=>k.trip<=0);if(k){k.trip=1.3;k.dx-=10;}
  const MSG={lego:'¡AY! ¡Un Lego!',ball:'¡Pelotazo!',cat:'¡Fsss! ¡El gato!',clothes:'¡Calzoncillo en la cara!',basket:'¡Cesto de ropa!',puddle:'¡Plaf! ¡Charco!',dog:'¡El perro quiere jugar!',trash:'¡Contra el cubo!',pigeon:'¡Palomas!',plank:'¡Coscorrón!',stroller:'¡Perdón, perdón!',schoolball:'¡Balonazo!'};
  say(MSG[o.type]||'¡Ay!',PX+60,p.y-230,'#fff',24);

function startMoment(m){
  m.done=true;
  const base={type:m.type,t:0,count:0,res:null,resT:0};
  if(m.type==='teeth')Object.assign(base,{need:12,dur:4.2});
  if(m.type==='light')Object.assign(base,{phase:'red',redT:rnd(1.2,2.6),greenT:0});
  if(m.type==='gate')Object.assign(base,{need:16,dur:4,open:.6});
  R.moment=base;R.p.vy=0;R.p.y=GY;R.p.onG=true;R.p.inv=0;R.p.spin=0;R.banner=null;R.kids.forEach(k=>{k.trip=0;});
}
function momentPress(){
  const m=R.moment;if(!m||m.res)return;
  if(m.type==='teeth'){m.count++;sfx('coin',m.count);puff(W/2+rnd(-60,60),250+rnd(-20,20),'#fff',4,90);if(m.count>=m.need){m.res='ok';R.score+=150;say('¡SONRISA BRILLANTE! +150',W/2,170,'#7cff7c',30);sfx('win');}}
  else if(m.type==='light'){
    if(m.phase==='red'){if(m.t<(m.lock||0))return;m.lock=m.t+1;m.fouls=(m.fouls||0)+1;if(m.fouls<=2){R.clock+=1;R.hits++;say('¡EN ROJO NO SE CRUZA! +1 MIN',W/2,150,'#ff6b6b',28);}else say('¡ESPERA AL VERDE!',W/2,150,'#ffd23f',28);sfx('bad');R.shake=.25;m.redT=Math.max(m.redT,m.t+rnd(.8,1.5));}
    else{const rt=m.t-m.greenT,b=Math.max(0,Math.round(200-rt*250));m.res='ok';R.score+=b;say((rt<.35?'¡REFLEJOS DE GATO! ':'¡VAMOS! ')+rt.toFixed(2)+'s  +'+b,W/2,150,'#7cff7c',28);sfx('power');}
  }
  else if(m.type==='gate'){m.count++;m.open=Math.min(1,m.open+.07);sfx('tap');if(m.count>=m.need){m.res='ok';R.score+=200;say('¡DENTRO! +200',W/2,150,'#7cff7c',34);sfx('bell');}}
}
function updateMoment(dt){
  const m=R.moment;m.t+=dt;
  if(m.res){m.resT+=dt;if(m.resT>1.1){const typ=m.type;R.moment=null;if(typ==='gate')finish();}return;}
  if(m.type==='teeth'&&m.t>m.dur){m.res='fail';R.clock+=1;say('Dientes a medias… +1 MIN',W/2,170,'#ff6b6b',28);sfx('bad');}
  if(m.type==='light'){if(m.phase==='red'&&m.t>m.redT){m.phase='green';m.greenT=m.t;sfx('tap');}if(m.phase==='green'&&m.t-m.greenT>2.5){m.res='ok';}}
  if(m.type==='gate'){m.open=Math.max(0,m.open-dt*.32);if(m.t>m.dur||m.open<=0){m.res='fail';R.clock+=2;say('Te toca firmar en conserjería ✍️ +2 MIN',W/2,150,'#ff6b6b',26);sfx('bad');}}
}
function update(dt){
  G.t+=dt;
  if(G.state!=='play')return;
  R.t+=dt;R.clock+=dt/SEC_PER_MIN;
  R.shake=Math.max(0,R.shake-dt);
  R.texts.forEach(s=>{s.t-=dt;s.y-=40*dt;});R.texts=R.texts.filter(s=>s.t>0);
  R.parts.forEach(q=>{q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;});R.parts=R.parts.filter(q=>q.t>0);
  if(R.banner){R.banner.t-=dt;if(R.banner.t<=0)R.banner=null;}
  const p=R.p;
  p.blinkT-=dt;if(p.blinkT<-.12)p.blinkT=rnd(2,4);
  if(R.moment){updateMoment(dt);p.ph+=dt*2;return;}
  // velocidad
  let target=speedAt(R.dist);if(R.power){if(R.power.type==='scooter')target*=1.4;if(R.power.type==='coffee')target*=1.28;}
  R.speed+=(target-R.speed)*Math.min(1,dt*3);
  const dd=R.speed*dt;R.dist+=dd;
  // tramo
  const sec=secAt(R.dist+PX);if(sec!==R.sec){R.sec=sec;R.banner={txt:sec==='calle'?'¡A LA CALLE!':'¡EL COLE!',t:1.6};sfx('power');}
  // momentos
  const m=R.moments.find(m=>!m.done&&R.dist>=m.at);if(m){startMoment(m);return;}
  // power-up
  if(R.power){R.power.t-=dt;if(R.power.t<=0)R.power=null;}
  // salto y gravedad
  inp.jumpBuf-=dt;
  if(inp.jumpBuf>0){
    if(p.onG){p.vy=-930;p.onG=false;p.jumps=1;p.sx=.78;p.sy=1.25;inp.jumpBuf=0;sfx('jump');puff(PX,GY,'#c9a27a',6,90);}
    else if(p.jumps<2){p.vy=-820;p.jumps=2;p.spin=1;inp.jumpBuf=0;sfx('jump2');puff(PX,p.y-40,'#fff',8,120);}
  }
  const ducking=inp.duckHeld&&p.onG;p.ducking=ducking;
  if(inp.duckHeld&&!p.onG&&p.vy<700)p.vy=Math.max(p.vy,700);
  let g=2600;if(R.power&&R.power.type==='umbrella'&&p.vy>0)g=600;
  p.vy+=g*dt;if(R.power&&R.power.type==='umbrella')p.vy=Math.min(p.vy,170);
  p.y+=p.vy*dt;
  if(p.y>=GY){if(!p.onG){p.sx=1.28;p.sy=.76;sfx('land');puff(PX,GY,'#c9a27a',6,80);}p.y=GY;p.vy=0;p.onG=true;p.jumps=0;}
  p.sx+=(1-p.sx)*Math.min(1,dt*12);p.sy+=(1-p.sy)*Math.min(1,dt*12);
  if(p.spin>0){p.spin=Math.max(0,p.spin-dt*2.8);}
  p.ph+=dd*.03;p.inv=Math.max(0,p.inv-dt);
  if(p.faceT>0){p.faceT-=dt;if(p.faceT<=0)p.face='happy';}
  if(!p.onG&&p.face!=='ouch')p.face='open';else if(p.onG&&p.face==='open')p.face='happy';
  // historia para los niños
  R.hist.push(p.y);if(R.hist.length>40)R.hist.shift();
  R.kids.forEach((k,i)=>{const slot=-110*(i+1);if(k.trip>0){k.trip-=dt;k.dx-=dd*.85;}else k.dx+=(slot-k.dx)*Math.min(1,dt*2.2);k.dx=Math.max(-PX-60,k.dx);});
  // frases
  R.lineT-=dt;if(R.lineT<=0){R.lineT=rnd(6,9);say(pick(HEROES[G.hero].lines),PX+20,p.y-200,'#ffd23f',22);}
  // generar y mover
  spawn();
  const top=p.y-(ducking?64:124),me={x:R.dist+PX-22,y:top,w:44,h:(ducking?64:124)-6};
  R.obs.forEach(o=>{
    o.t+=dt;const def=OB[o.type];
    if(o.smash){o.x+=200*dt;o.y+=o.vy*dt;o.vy+=1600*dt;o.rot=(o.rot||0)+dt*8;return;}
    if(o.vx)o.x+=o.vx*dt;if(def.update)def.update(o,dt);
    const hb=def.hb?def.hb(o):{x:o.x+8,y:o.y+8,w:o.w-16,h:o.h-8};
    if(!o.hitDone&&me.x<hb.x+hb.w&&me.x+me.w>hb.x&&me.y<hb.y+hb.h&&me.y+me.h>hb.y){o.hitDone=true;hit(o);}
    if(!o.passed&&o.x+o.w<R.dist+PX-30){o.passed=true;if(!o.hitDone&&!o.smash){R.score+=5*R.mult;}}
  });
  R.obs=R.obs.filter(o=>o.x+o.w>R.dist-150&&o.y<H+200);
  R.items.forEach(it=>{
    if(it.taken)return;
    const dx=(it.x)-(R.dist+PX),dy=it.y-(top+ (ducking?32:62));
    const rad=it.kind==='power'?54:44;
    if(Math.abs(dx)<rad&&Math.abs(dy)<(ducking?44:80)){
      it.taken=true;
      if(it.kind==='toast'){R.toasts++;R.streak++;R.mult=Math.min(5,1+Math.floor(R.streak/8));R.score+=10*R.mult;sfx('coin',R.streak%12);puff(PX+dx,it.y,'#ffd23f',5,100);
        if(R.streak%8===0&&R.mult>1)say('¡RACHA x'+R.mult+'!',PX+40,it.y-50,'#ffd23f',32);}
      else{R.power={type:it.type,t:POWERS[it.type].dur};sfx('power');say(POWERS[it.type].name,PX+40,GY-250,'#fff',36);puff(PX,p.y-60,POWERS[it.type].col,20,240);}
    }
  });
  R.items=R.items.filter(it=>!it.taken&&it.x>R.dist-100);
}
function finish(){
  G.state='end';stopMusic();
  const arr=Math.floor(R.clock),diff=BELL-arr;
  let stars,title,msg;
  if(diff>=2){stars=3;title='¡FAMILIA PUNTUAL!';msg=`Llegáis a las <b>${fmt(arr)}</b>. Hasta el conserje aplaude 👏`;}
  else if(diff>=0){stars=2;title='¡POR LOS PELOS!';msg=`Entráis a las <b>${fmt(arr)}</b>, con la campana sonando 🔔`;}
  else{stars=1;title='¡LLEGAMOS TARDE!';msg=`Son las <b>${fmt(arr)}</b>… ${-diff} min tarde. ¡Mañana lo bordáis!`;}
  let best=0,rec=false;try{best=parseInt(localStorage.getItem('sr-best'))||0;if(R.score>best){localStorage.setItem('sr-best',R.score);rec=best>0;best=R.score;}}catch(e){}
  const e=$('#end');
  e.innerHTML=`<div class="card"><h1>${title}</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${msg}</p>
    <div class="res"><span>🏆 ${R.score} puntos</span><span>🍞 ${R.toasts} tostadas</span><span>💥 ${R.hits} golpes</span></div>
    ${rec?'<p class="best">¡NUEVO RÉCORD!</p>':`<p class="best">Récord: ${best}</p>`}
    <button class="btn" id="again">OTRA MAÑANA</button><button class="btn alt" id="tomenu">CAMBIAR</button></div>`;
  e.classList.remove('hidden');
  $('#again').onclick=play;$('#tomenu').onclick=menu;
  if(stars>=2)sfx('win');else sfx('bad');
}

  rr(px0,30,pw,16,8,'rgba(43,35,64,.55)',0);rr(px0,30,Math.max(16,pw*pr),16,8,'#7cff7c',3);
  [[0,'🏠'],[B1/D,'🌳'],[B2/D,'🏫']].forEach(([f,e])=>{ctx.font='22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,px0+pw*f+(f?0:-4),20);});
  circ(px0+pw*pr,38,13,SKIN,3);circ(px0+pw*pr,32,10,HEROES[G.hero].hair,0);circ(px0+pw*pr,38,10,SKIN,0);circ(px0+pw*pr+4,37,2,OL,0);
  // puntos
  rr(W-226,14,160,56,16,'#fff',5);drawToast(W-196,42,0);txt(String(R.score),W-120,42,30,OL,'center','#fff');
  if(R.mult>1){rr(W-90,58,54,28,12,'#ffd23f',4);txt('x'+R.mult,W-63,72,20,OL,'center','#ffd23f');}
  // power-up activo
  if(R.power){const P=POWERS[R.power.type],f=R.power.t/P.dur;ctx.beginPath();ctx.arc(W-40,120,24,-Math.PI/2,-Math.PI/2+Math.PI*2*f);ctx.lineWidth=8;ctx.strokeStyle=P.col;ctx.stroke();drawPower(R.power.type,W-40,120,0);}
  // banner de tramo
  if(R.banner&&!R.moment){const a=Math.min(1,R.banner.t*2);ctx.globalAlpha=a;txt(R.banner.txt,W/2,170,64,'#ffd23f');ctx.globalAlpha=1;}
  // ayuda al principio
  if(R.t<4&&!R.moment){ctx.globalAlpha=Math.min(1,(4-R.t));
    txt(TOUCH?'Toca la derecha: SALTAR (2 veces = doble)':'ESPACIO / ↑ : SALTAR  (dos veces = doble salto)',W/2,240,24,'#fff');
    txt(TOUCH?'Mantén la izquierda: AGACHARSE':'↓ : AGACHARSE',W/2,276,24,'#fff');ctx.globalAlpha=1;}
}
function drawMoment(){
  const m=R.moment;if(!m)return;
  ctx.fillStyle='rgba(30,24,56,.35)';ctx.fillRect(0,0,W,H);
  if(m.type==='teeth'){
    rr(W/2-230,90,460,300,30,'#fff',6);txt('¡A LAVARSE LOS DIENTES!',W/2,128,32,'#7b6cf6');
    // boca
    ell(W/2,250,150,70,'#c0392b',5);ctx.save();ctx.beginPath();ctx.ellipse(W/2,250,146,66,0,0,Math.PI*2);ctx.clip();
    for(let i=0;i<7;i++){rr(W/2-140+i*40,190,36,40,8,'#fffdf2',3);rr(W/2-140+i*40,270,36,40,8,'#fffdf2',3);}
    const dirty=1-m.count/m.need;ctx.globalAlpha=dirty;for(let i=0;i<9;i++){circ(W/2-120+hash(i)*240,210+hash(i+9)*80,8,'#7bd389',2);}ctx.globalAlpha=1;
    for(let i=0;i<m.count;i++)circ(W/2-130+hash(i+20)*260,200+hash(i+40)*100,10+hash(i)*8,'#fff',2);
    ctx.restore();
    const bx=W/2+Math.sin(G.t*30)*(m.count?60:20);ctx.save();ctx.translate(bx,300);ctx.rotate(-.3);rr(-10,0,150,22,10,'#3d7be0',4);rr(-34,-16,40,24,6,'#fff',4);ctx.restore();
    rr(W/2-180,350,360,22,11,'#eee',3);rr(W/2-180,350,Math.max(22,360*Math.min(1,m.count/m.need)),22,11,'#7cff7c',3);
    txt(m.res?'':TOUCH?'¡TOCA RÁPIDO!':'¡PULSA ESPACIO RÁPIDO!',W/2,420,30,'#ffd23f');
    if(!m.res){const left=Math.max(0,m.dur-m.t);txt(left.toFixed(1)+'s',W/2+200,128,22,'#ff6b6b');}
  }else if(m.type==='light'){
    const x=W/2+160;rr(x-10,180,20,GY-180,6,'#4a4a5c',4);rr(x-46,60,92,200,20,OL,0);
    circ(x,104,30,m.phase==='red'?'#ff3b3b':'#4a1a1a',4);circ(x,198,30,m.phase==='green'?'#39ff6a':'#123a1a',4);
    if(m.phase==='red'){txt('¡ROJO! ESPERA…',W/2-120,200,40,'#ff6b6b');}
    else txt(TOUCH?'¡VERDE! ¡TOCA!':'¡VERDE! ¡ESPACIO!',W/2-120,200,44,'#7cff7c');
    for(let i=0;i<6;i++)rr(W/2+60+i*34,GY+48,22,46,3,'#fff',0);
  }else if(m.type==='gate'){
    txt('¡QUE CIERRAN LA PUERTA!',W/2,120,42,'#ffd23f');
    txt(TOUCH?'¡TOCA SIN PARAR PARA ENTRAR!':'¡PULSA ESPACIO SIN PARAR!',W/2,170,28,'#fff');
    rr(W/2-180,200,360,24,12,'#eee',3);rr(W/2-180,200,Math.max(24,360*m.open),24,12,m.open>.3?'#7cff7c':'#ff6b6b',3);
  }
}

// =====================================================================
//  ENTRADA
// =====================================================================
const TOUCH=matchMedia('(pointer:coarse)').matches;
function press(){if(G.state!=='play')return;if(R.moment){momentPress();return;}inp.jumpBuf=.14;}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if([' ','ArrowUp','ArrowDown','w','s'].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W')press();
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')inp.duckHeld=true;
  if(e.key==='Escape'&&G.state==='play')menu();
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')inp.duckHeld=false;});
const pointers=new Map();
cvs.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(e.pointerType!=='mouse'&&x<.4&&G.state==='play'&&!(R&&R.moment)){pointers.set(e.pointerId,'duck');inp.duckHeld=true;}
  else{pointers.set(e.pointerId,'jump');press();}
});
const up=e=>{if(pointers.get(e.pointerId)==='duck'){pointers.delete(e.pointerId);inp.duckHeld=[...pointers.values()].includes('duck');}else pointers.delete(e.pointerId);};
['pointerup','pointercancel','pointerleave'].forEach(ev=>cvs.addEventListener(ev,up));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC)AC.suspend();else if(AC&&G.state==='play')AC.resume();});

// =====================================================================
//  MENÚ
// =====================================================================
function menu(){
  G.state='menu';R=null;stopMusic();$('#end').classList.add('hidden');
  let best=0;try{best=parseInt(localStorage.getItem('sr-best'))||0;}catch(e){}
  const m=$('#menu');
  m.innerHTML=`<div class="card"><h1>SCHOOL RUSH</h1><div class="sub">¡Que llegamos tarde! 🔔</div>
    <p>Son las <b>8:40</b> y el cole cierra a las <b>9:00</b>. ¡Corre con los peques de casa al cole!</p>
    <div class="heroes">${Object.keys(HEROES).map(h=>`<button class="hero ${G.hero===h?'sel':''}" data-h="${h}"><canvas width="220" height="240"></canvas>${HEROES[h].name}</button>`).join('')}</div>
    <div class="names"><input id="n0" maxlength="12" value="${esc(G.names[0])}" aria-label="Nombre peque 1"><input id="n1" maxlength="12" value="${esc(G.names[1])}" aria-label="Nombre peque 2"></div>
    <div class="how">${TOUCH?'<span>👉 Toca derecha: saltar</span><span>👈 Mantén izquierda: agacharse</span>':'<span>Espacio/↑: saltar (doble)</span><span>↓: agacharse</span>'}<span>🍞 Tostadas = puntos</span></div>
    ${best?`<p class="best">🏆 Récord: ${best} puntos</p>`:''}
    <button class="btn" id="play">¡A CORRER!</button></div>`;
  m.classList.remove('hidden');
  m.querySelectorAll('.hero').forEach(b=>{
    const c=b.querySelector('canvas'),x=c.getContext('2d');
    b.onclick=()=>{G.hero=b.dataset.h;m.querySelectorAll('.hero').forEach(z=>z.classList.toggle('sel',z===b));sfx('tap');};
    x.setTransform(1.4,0,0,1.4,0,0);
    drawWith(x,()=>drawAdult(76,168,{hero:b.dataset.h,state:'idle',t:0,face:'happy'}));
  });
  $('#play').onclick=play;
}
function drawWith(c,fn){const old=ctx;ctx=c;try{fn();}finally{ctx=old;}}
function play(){
  const n0=$('#n0'),n1=$('#n1');
  if(n0&&n1){G.names=[n0.value.trim()||'Peque 1',n1.value.trim()||'Peque 2'];}
  try{localStorage.setItem('sr-names',JSON.stringify(G.names));localStorage.setItem('sr-hero',G.hero);}catch(e){}
  $('#menu').classList.add('hidden');$('#end').classList.add('hidden');
  newRun();G.state='play';audio();startMusic();sfx('power');
}

// ---------- bucle ----------
let last=0;
function loop(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  update(dt);render();
  requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
